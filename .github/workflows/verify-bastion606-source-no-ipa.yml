name: ASTEROIDY iOS - PC609 Bastion baked-GLB and source fleet regression NO IPA
on:
  push:
    branches: [feature/ios-bastion-pc609]
    paths:
      - '.github/workflows/verify-bastion606-source-no-ipa.yml'
      - 'ASTEROIDYiOS/SourceVanguardMesh431.swift'
      - 'ASTEROIDYiOS/H55SourceMechanics580.swift'
      - 'ASTEROIDYiOS/PC602HomeShipPose291.swift'
      - 'ASTEROIDYiOS/PC602HomeFlight291.swift'
      - 'Tests/BastionMesh606Tests.swift'
      - 'Tests/IOSOriginalCombatHUD331Contract.py'
      - 'ASTEROIDYiOS/SourcePauseMenu568.swift'
      - 'ASTEROIDYiOS/Sector01Scene568.swift'
      - 'Tools/build_bastion606_ios_pack.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bastion-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify binary 6061 format with the SAME reader as Vanguard431
        run: |
          set -euo pipefail
          swiftc ASTEROIDYiOS/SourceVanguardMesh431.swift Tests/BastionMesh606Tests.swift -o /tmp/bastion606
          /tmp/bastion606
      - name: Verify PC609 asset transfer constants remain SHA locked
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          script=Path('Tools/build_bastion606_ios_pack.py').read_text()
          source=Path('ASTEROIDYiOS/SourceBastion606.swift').read_text()
          physics=Path('ASTEROIDYiOS/H55SourceMechanics580.swift').read_text()
          assert 'BST60901' in script and 'BST60901' in source
          for digest in ('5b9257d55d403a28ef37d370f95a1796e236b7bef34a695a313b1a48450baca6',
                         '4882d508b527d1f13171cf72d732addbaf393681d37942378be5b39ef09fe65e',
                         'd18d651aab74bebdb2215940c0774c8aa3f0aff9101c0b7122c336110b3f5e7c'):
              assert digest in script and digest in source
          assert 'case 2:return bastionAssetURL == nil ? nil' in physics
          print('PASS PC609 Bastion source checksums, separate asset registration, no Vanguard substitution')
          PY
      - name: Verify shared CARBONIS/H290 pause HUD contract
        run: |
          set -euo pipefail
          python3 Tests/IOSOriginalCombatHUD331Contract.py
