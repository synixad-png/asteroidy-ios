          xcodegen generate --spec project.yml
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$RUNNER_TEMP/asteroidy-v568-scout-build" build \
            > "$RUNNER_TEMP/scout-xcodebuild.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/scout-xcodebuild.log"
              exit 1
            }
          test ! -e ASTEROIDY_iOS_UNSIGNED.ipa
          echo "PASS: iOS simulator code compiles; B82S source reader validated; NO IPA"
  # from .github/workflows/verify-v568-w3-native-menu-once.yml
  # One-shot REAL source-guided W3 home-screen screenshots on Apple simulators.
  # No illustrative mockups, no IPA, no signing and no mission unlock.
  # Avoid spending macOS runner minutes on obsolete intermediate revisions.
  genuine-w3-menu-simulator:
    needs: select
    if: ${{ contains(needs.select.outputs.jobs, ' genuine-w3-menu-simulator ') }}
    permissions:
      contents: read
    concurrency:
      group: w3-original-menu-${{ github.ref }}-genuine-w3-menu-simulator-${{ strategy.job-index }}
      cancel-in-progress: true
    name: Source-guided native W3 menu on ${{ matrix.device }} Simulator
    strategy:
      fail-fast: false
      matrix:
        device: [IPHONE, IPAD]
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify original source captions and actual navigation routes
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 Tests/V568W3NativeMenuContract.py | tee reports/w3-source-contract.txt
          python3 -m py_compile Tools/run_w3_native_menu_simulator_capture.py
          python3 Tests/V568W3SimulatorAudioWaitContract.py
          python3 -m py_compile Tools/convert_v568_w3_home_planet290.py Tools/prepare_v568_w3_home_planet290.py
          python3 Tests/V568W3HomePlanet290Tests.py | tee reports/w3-NewHome290-source-planet.txt
          python3 Tests/V568W3HomeShipSourceContract.py | tee reports/w3-source-vanguard-ship.txt
          swift Tools/verify_simulator_render_snapshot.swift --self-test | tee reports/w3-screenshot-detector.txt
      - name: Require exact v568 W3 background/logo, verify CRC and both SHA256
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 Tests/V568W3MenuSourceImagesTests.py
          python3 Tools/prepare_v568_w3_original_assets.py --root . --destination ASTEROIDYiOS/Assets --required
          test -s ASTEROIDYiOS/Assets/W3Background568Original.dat
          test -s ASTEROIDYiOS/Assets/W3Logo568Original.dat
      - name: Prepare real original NewHome290 3D planet for native W3 home
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python3 Tools/prepare_v568_w3_home_planet290.py --root . --destination ASTEROIDYiOS/Assets | tee reports/w3-source-planet-stage.txt
          test -s ASTEROIDYiOS/Assets/W3HomePlanet290OriginalGPU.bin
          test -s ASTEROIDYiOS/Assets/W3HomePlanet290Base.dat
          test -s ASTEROIDYiOS/Assets/W3HomePlanet293Glow.dat
      - name: Create native iOS source project (no HTML/WebView)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Compile original ASTEROIDY native iPhone/iPad application without IPA
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$PWD/build/W3NativeMenuSimulator" \
            build > reports/xcodebuild.log 2>&1 || {
              tail -n 140 reports/xcodebuild.log
              exit 1
            }
          APP=$(find build/W3NativeMenuSimulator/Build/Products/Debug-iphonesimulator \
                -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          python3 - "$APP" <<'PY' | tee reports/menu-compiled-app.txt
          import pathlib,plistlib,sys,hashlib
          app=pathlib.Path(sys.argv[1])
          info=plistlib.loads((app/"Info.plist").read_bytes())
          assert set(info.get("UIDeviceFamily",[]))=={1,2}
          assert info.get("CFBundleIdentifier")=="com.synixad.asteroidyios"
          assert len(list(app.rglob("default.metallib")))==1
          originals={
            "W3Background568Original.dat":"a8aa28883084657f0c38900dbb011de09e2b0fd461704d370a68858be0178145",
            "W3Logo568Original.dat":"cab4198b953640c787975c5a8436a0fdeaa82502b40e000077ff055cc0709e09",
            "W3HomePlanet290OriginalGPU.bin":"e93a0bbafc9bb50a25726a828ada81f36675bf88d802c5a8f985b89b6dc96c1b",
            "W3HomePlanet290Base.dat":"4987f35cd6f021fd98794f406c641f4853c538a82b10625e6b79e860c8a787c0",
            "W3HomePlanet293Glow.dat":"6f1debd175f52b7ce1fbc687e9977597335ee432858d7d6d6e47cf66b5f9aa39"
          }
          for name,sha in originals.items():
            bundled=list(app.rglob(name))
            assert len(bundled)==1,(name,bundled)
            actual=hashlib.sha256(bundled[0].read_bytes()).hexdigest()
            assert actual==sha,(name,actual)
          print("PASS: native iPhone+iPad app contains BOTH original SHA256-pinned W3 images and Metal")
          PY
      - name: Actually run W3 main menu on Apple simulator and capture real frame
        timeout-minutes: 18
        run: |
          set -euo pipefail
          APP=$(find build/W3NativeMenuSimulator/Build/Products/Debug-iphonesimulator \
                -maxdepth 1 -type d -name '*.app' -print -quit)
          python3 -u Tools/run_w3_native_menu_simulator_capture.py \
            --app "$APP" --reports reports --only ${{ matrix.device }} \
            | tee reports/w3-actual-simulator.txt
      - name: Archive only genuine W3 screenshot and diagnostic logs, no IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-v568-W3-NATIVE-${{ matrix.device }}-real-screen-NO-IPA
          path: |
            reports/*.txt
            reports/*.log
            reports/*_W3_appearance_proof.json
            reports/*_W3_NewHome290_GPU_proof.json
            reports/*_W3_Vanguard431_GPU_proof.json
            reports/*_VERIFIED_ASTEROIDY_W3_NATIVE.png
            reports/selected-devices.json
          if-no-files-found: ignore
          retention-days: 7
  # from .github/workflows/verify-v568-w3-navigation-ui.yml
  # True UIKit/SwiftUI user interactions, NOT a source string or screenshot test.
  # Separate from the menu GPU proof so a slow Apple simulator does not
  # invalidate successful graphics validation.
  actual-touch-navigation:
    needs: select
    if: ${{ contains(needs.select.outputs.jobs, ' actual-touch-navigation ') }}
    permissions:
      contents: read
    concurrency:
      group: w3-menu-touch-${{ github.ref }}-actual-touch-navigation-${{ strategy.job-index }}
      cancel-in-progress: true
    name: Tap all seven original W3 actions on ${{ matrix.device }}
    runs-on: macos-15-intel
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [IPHONE, IPAD]
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact original assets and native source menu contracts
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 Tests/V568W3NativeMenuContract.py | tee reports/menu-source.txt
          python3 Tests/V568W3HomeShipSourceContract.py | tee reports/menu-source-ship.txt
          python3 Tests/V568W3MenuSourceImagesTests.py | tee reports/original-images.txt
          python3 Tools/prepare_v568_w3_original_assets.py --root . --destination ASTEROIDYiOS/Assets --required
          python3 Tools/prepare_v568_w3_home_planet290.py --root . --destination ASTEROIDYiOS/Assets
      - name: Generate app and W3 XCTest Xcode projects
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Locate authentic Apple Simulator device
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"Tools")
          from run_original_ios_simulator_capture import available_devices
          devices=available_devices(("${{ matrix.device }}",))
          _,name,udid,state=devices["${{ matrix.device }}"]
          print("Apple Simulator:",name,udid,state)
          with open("reports/selected-device.txt","w") as f:
              f.write(name+" "+udid+"\n")
          with open("reports/device-udid.txt","w") as f:
              f.write(udid+"\n")
          PY
      - name: Tap seven W3 actions and test native explosion/projectile settings after relaunch
        timeout-minutes: 29
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(cat reports/device-udid.txt)
          xcodebuild test \
            -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -parallel-testing-enabled NO \
            -only-testing:ASTEROIDYW3UITests/W3MenuNavigationUITests \
            -only-testing:ASTEROIDYW3UITests/W3StartupSplashUITests \
            -only-testing:ASTEROIDYW3UITests/CarbonisVisualSettingsUITests \
            -derivedDataPath "$PWD/build/W3Touch" \
            -resultBundlePath "$PWD/reports/W3-Actual-${{ matrix.device }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > reports/xcodebuild-ui-test.log 2>&1 || {
              tail -n 160 reports/xcodebuild-ui-test.log
              exit 1
            }
          grep -E 'Executed [0-9]+ tests|Test Suite .* passed' \
            reports/xcodebuild-ui-test.log | tail -n 6 \
            | tee reports/w3-ui-tests-pass.txt
          test ! -e ASTEROIDY_iOS_UNSIGNED.ipa
      - name: Preserve real XCTest results, never fabricated UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-v568-W3-REAL-TOUCH-${{ matrix.device }}-XCTest-NO-IPA
          path: |
            reports/*.txt
            reports/*.log
            reports/W3-Actual-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
