          python3 Tools/convert_v568_alien_scout_b82s.py \
            --source "$RUNNER_TEMP/asteroidy-v568-original/PortingResources/v568/Shared/Assets_Boss82_GZ/alien_scout_173.b82.gz" \
            --out "$RUNNER_TEMP/v568-boss-original"
      - name: Compile and execute original B82S reader on Apple Swift
        run: |
          set -euo pipefail
          swiftc -O ASTEROIDYiOS/SourceAlienScout173.swift \
            Tests/SourceAlienScout173NativeTests.swift \
            -o "$RUNNER_TEMP/b82s-source-verify"
          "$RUNNER_TEMP/b82s-source-verify" "$RUNNER_TEMP/v568-boss-original"
      - name: Verify original iOS app still typechecks with the additional source reader, without IPA
        run: |
          set -euo pipefail
