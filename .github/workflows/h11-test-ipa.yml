    branches:
      - feature/ios-h55-v580-native-entry
    paths:
      - '.github/workflows/h11-test-ipa.yml'
      - 'ASTEROIDYiOS/H55NpcDialogue580.swift'
      - 'Tests/H55NpcDialogue580Tests.swift'
      - 'ASTEROIDYiOS/H55Workshop580.swift'
      - 'ASTEROIDYiOS/H55SourceMechanics580.swift'
      - 'Tests/H55SourceMechanics580Tests.swift'
      - 'ASTEROIDYiOS/H55WorkshopPanel580.swift'
      - 'ASTEROIDYiOS/CombatGuardianDrone298.swift'
      - 'ASTEROIDYiOS/CarbonisCombat568.swift'
      - 'ASTEROIDYiOS/Sector01Shop568.swift'
      - 'ASTEROIDYiOS/CarbonisSession568.swift'
      - 'ASTEROIDYiOS/Sector01ShopPanel568.swift'
      - 'Tests/H11RailSwarm580Tests.swift'
      - 'ASTEROIDYiOS/Sector01Scene568.swift'
      - 'ASTEROIDYiOS/App.swift'
      - 'Tests/H55Workshop580Tests.swift'
      - 'ASTEROIDYiOS/SourceNewGame568.swift'
      - 'Tests/SourceNewGame568Tests.swift'
      - 'ASTEROIDYiOS/H55NpcDetour580.swift'
