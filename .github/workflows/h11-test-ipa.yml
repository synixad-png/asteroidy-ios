          swiftc -frontend -parse ASTEROIDYiOS/Sector01Scene568.swift
          swiftc -frontend -parse ASTEROIDYiOS/App.swift
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ASTEROIDYiOS/H55NpcMotion580.swift').read_text()
          assert 'walkCycleMeters:Float=4.01' in s and 'bodyMass:Float=110' in s
          assert 'blendSeconds:Float=0.25' in s and 'landingSpring:Float=18000' in s
