  build-h55-ipa:
    needs: verify-h55
    name: Build H11 native iPhone/iPad unsigned TEST IPA
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify iOS resource inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 Tools/verify_ios_inputs.py | tee reports/verify-inputs.txt
          python3 Tools/prepare_vanguard431_assets.py | tee reports/vanguard-import.txt
          python3 Tools/verify_original_vanguard_resources.py --assets ASTEROIDYiOS/Assets | tee reports/verify-vanguard.txt
          test ! -e ASTEROIDYiOS/Assets/hangar_h55.glb || {
            echo 'Unverified GLB bundled, aborting'; exit 1;
          }
      - name: Restore all original game assets from the proven full IPA pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/prepare_v568_carbonis_sector01.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/prepare_v568_w3_home_planet290.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/prepare_v568_w3_original_assets.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/verify_original_audio568_assets.py
          python3 Tests/CarbonisPlanetOpaqueCull568.py
          python3 - <<'PY'
          from pathlib import Path
          original=Path('ASTEROIDYiOS/Assets')
          required=['Sector01CarbonisBase.dat','Sector01CarbonisEmissive.dat',
                    'Sector01CarbonisHeightMap.dat','Sector01CarbonisIndices.bin',
                    'Sector01CarbonisIrradiance.dat','Sector01CarbonisSource.json',
                    'Sector01CarbonisVertices.bin','W3Background568Original.dat',
                    'W3HomePlanet290Base.dat','W3HomePlanet290OriginalGPU.bin',
                    'W3HomePlanet290Source.json','W3HomePlanet293Glow.dat',
                    'W3Logo568Original.dat']
          missing=[f for f in required if not (original/f).is_file() or (original/f).stat().st_size == 0]
          assert not missing, 'Missing required original game assets: '+str(missing)
          print('PASS all 13 critical original game assets staged')
          PY
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Resolve exact GLTFKit2 0.5.15 dependency (repair partial SwiftPM artifact on retry)
        shell: bash
        run: |
          set -euo pipefail
          success=no
          for attempt in 1 2 3 4 5; do
            echo "Resolving pinned Swift package, attempt $attempt/5"
            if xcodebuild -project ASTEROIDYiOS.xcodeproj \
              -scheme ASTEROIDYiOS -derivedDataPath "$PWD/build/DerivedData" \
              -resolvePackageDependencies 2>&1 | tee "reports/resolve-$attempt.log"; then
              success=yes
              break
            fi
            # Xcode/SwiftPM may leave a partially-created binary artifact
            # folder after an interrupted GitHub release download. Retrying
            # without clearing ONLY that exact pinned GLTFKit2 v0.5.15
            # artifact makes all 5 attempts fail with 'already exists'.
            cache="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
            partial="$cache/https___github_com_warrenm_GLTFKit2_releases_download_0_5_15_GLTFKit2_xcframework_zip"
            if grep -Fq 'already exists in file system' "reports/resolve-$attempt.log"; then
              if [ -d "$partial" ] && [ -d "$cache" ]; then
                echo "Remove ONLY incomplete GLTFKit2 0.5.15 SwiftPM artifact, preserve other caches"
                rm -rf -- "$partial"
              fi
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 7)); fi
          done
          if [ "$success" != yes ]; then
            echo "Pinned GLTFKit2 binary unavailable after five attempts"
            exit 1
          fi
      - name: Build actual arm64 device app (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO 'TARGETED_DEVICE_FAMILY=1,2' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$PWD/build/DerivedData" \
            build 2>&1 | tee reports/build.log
      - name: Package and verify H55 test IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP" && test -f "$APP/Info.plist"
          test -f "$APP/ASTEROIDY iOS" || test -f "$APP/ASTEROIDYiOS"
          mkdir -p distribution/Payload
          cp -R "$APP" distribution/Payload/
          (cd distribution && zip -q -r -y ../ASTEROIDY_v580_H11_WARSZTAT_SERWIS_TEST_UNSIGNED.ipa Payload)
          python3 Tools/verify_ipa.py ASTEROIDY_v580_H11_WARSZTAT_SERWIS_TEST_UNSIGNED.ipa --require-vanguard-original | tee reports/ipa-validation.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          name='ASTEROIDY_v580_H11_WARSZTAT_SERWIS_TEST_UNSIGNED.ipa'
          required=['Sector01CarbonisBase.dat','Sector01CarbonisEmissive.dat',
                    'Sector01CarbonisHeightMap.dat','Sector01CarbonisIndices.bin',
                    'Sector01CarbonisIrradiance.dat','Sector01CarbonisSource.json',
                    'Sector01CarbonisVertices.bin','W3Background568Original.dat',
                    'W3HomePlanet290Base.dat','W3HomePlanet290OriginalGPU.bin',
                    'W3HomePlanet290Source.json','W3HomePlanet293Glow.dat',
                    'W3Logo568Original.dat']
          with zipfile.ZipFile(name) as z:
              members=set(z.namelist())
              missing=[x for x in required if 'Payload/ASTEROIDY iOS.app/'+x not in members]
              assert not missing,'IPA missing original game assets: '+str(missing)
              print('PASS original game assets physically embedded in test IPA')
          PY
          python3 - <<'PY'
          import zipfile
          p='ASTEROIDY_v580_H11_WARSZTAT_SERWIS_TEST_UNSIGNED.ipa'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              paths=z.namelist()
              assert any(n.startswith('Payload/') and n.endswith('Info.plist') for n in paths)
              assert not any(n.endswith('/hangar_h55.glb') for n in paths)
          print('PASS zip CRC, valid Payload, source v580 H55 requires one-time Files import')
          PY
          shasum -a 256 ASTEROIDY_v580_H11_WARSZTAT_SERWIS_TEST_UNSIGNED.ipa | tee reports/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" | tee reports/build-commit.txt
          echo "GLB: exact original 126419336-byte hangar_h55.glb must be imported once from iOS Files; H70 source clips sampled, no GLB embedded" | tee reports/H55_IMPORT_REQUIRED.txt
      - name: Upload test IPA and build report
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-v580-H11-SHOP-REAL-SERVICE-TEST-unsigned-IPA
          path: |
            ASTEROIDY_v580_H11_WARSZTAT_SERWIS_TEST_UNSIGNED.ipa
            reports/ipa-validation.txt
            reports/SHA256SUMS.txt
            reports/build-commit.txt
            reports/H55_IMPORT_REQUIRED.txt
          retention-days: 14
          if-no-files-found: error
      - name: Upload compilation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-H11-TEST-build-logs
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
