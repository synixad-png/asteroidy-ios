          swiftc -O ASTEROIDYiOS/H55CollisionGeometry580.swift ASTEROIDYiOS/H55SpatialSupport580.swift ASTEROIDYiOS/H55TriangleBody580.swift ASTEROIDYiOS/H55NpcDetour580.swift ASTEROIDYiOS/H55NpcSurface580.swift ASTEROIDYiOS/H55Mechanic580.swift ASTEROIDYiOS/H55Airlocks580.swift Tests/H55NpcRealRoute580Tests.swift -o /tmp/h08-original-126mb-glb-e2e
