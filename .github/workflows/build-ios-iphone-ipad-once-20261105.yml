# One-time IPA requested by user 2026-11-05 ('gdzie ipa').
# Only this workflow file's creation triggers the build; ordinary code
# commits will NOT launch additional IPA builds.
name: ASTEROIDY iOS - iPhone + iPad orbital preview IPA (one shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios-iphone-ipad-once-20261105.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-universal:
    name: Compile iPhone + iPad arm64 and validate unsigned IPA
    # macos-15-intel produced a real verified iPhone IPA in run 42090319849.
    # The runner's CPU is Intel; Xcode targets arm64 physical iOS devices.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify iPhone and iPad are enabled in the source project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY' | tee reports/device-families.txt
          from pathlib import Path
          project = Path('project.yml').read_text()
          assert "TARGETED_DEVICE_FAMILY: '1,2'" in project, 'Expected both iPhone and iPad'
          assert 'INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone' in project
          assert 'INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad' in project
          print('PASS: native project declares iPhone + iPad (UIDeviceFamily 1,2)')
          PY
          python3 Tools/verify_ios_inputs.py | tee reports/source-assets.txt
      - name: Record native Apple compiler and source revision
        shell: bash
        run: |
          set -euo pipefail
          { sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; echo "Commit: $GITHUB_SHA"; } | tee reports/environment.txt
      - name: Generate original iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Compile universal iPhone and iPad device target (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO 'TARGETED_DEVICE_FAMILY=1,2' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$PWD/build/DerivedData" \
            build 2>&1 | tee reports/xcodebuild.log
      - name: Package and verify actual unsigned dual-device IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP" && test -f "$APP/Info.plist"
          mkdir -p distribution/Payload
          cp -R "$APP" distribution/Payload/
          (cd distribution && zip -q -r -y ../ASTEROIDY_iPhone_iPad_UNSIGNED.ipa Payload)
          python3 Tools/verify_ipa.py ASTEROIDY_iPhone_iPad_UNSIGNED.ipa | tee reports/verification.txt
          shasum -a 256 ASTEROIDY_iPhone_iPad_UNSIGNED.ipa | tee reports/SHA256SUMS.txt
      - name: Upload real unsigned iPhone + iPad IPA
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-iPhone-iPad-unsigned-IPA
          path: |
            ASTEROIDY_iPhone_iPad_UNSIGNED.ipa
            reports/device-families.txt
            reports/source-assets.txt
            reports/environment.txt
            reports/verification.txt
            reports/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish build diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-iPhone-iPad-build-diagnostics
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
