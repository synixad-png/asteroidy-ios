# One-shot IPA explicitly requested by user 2026-11-06.
# Ordinary source commits do NOT trigger a new IPA.
# This is UNSIGNED ARM64 iPhone+iPad, not a signed App Store package.
name: ASTEROIDY v568 W3 accessible menu iPhone+iPad IPA 20261106

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-asteroidy-w3-menu-nav-ipa-once-20261106.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-device-ipa:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify original asset archive and campaign source invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 Tools/verify_ios_inputs.py | tee reports/preflight-ios.txt
          python3 Tests/V568W3NativeMenuContract.py | tee reports/w3-menu-contract.txt
          python3 -m py_compile Tests/V568W3NativeMenuContract.py
          python3 Tests/V568W3HomeShipSourceContract.py | tee reports/w3-source-ship-contract.txt
          python3 Tests/V568W3MenuSourceImagesTests.py | tee reports/w3-original-images.txt
          python3 Tests/V568W3HomePlanet290Tests.py | tee reports/w3-original-planet.txt
          python3 Tests/V568W3HomeSourceLightTests.py | tee reports/w3-lighting.txt
          python3 Tools/verify_original_vanguard_resources.py --assets ASTEROIDYiOS/Assets | tee reports/original-vanguard.txt
      - name: Stage EXACT original v568 W3 background/logo and NewHome290 3D planet
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/prepare_v568_w3_original_assets.py --root . --destination ASTEROIDYiOS/Assets --required | tee reports/stage-w3-images.txt
          python3 Tools/prepare_v568_w3_home_planet290.py --root . --destination ASTEROIDYiOS/Assets | tee reports/stage-w3-globe.txt
      - name: Record revision and native device target
        shell: bash
        run: |
          set -euo pipefail
          { echo "Git SHA: $GITHUB_SHA"; sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; } | tee reports/environment.txt
          grep -q "TARGETED_DEVICE_FAMILY: '1,2'" project.yml
      - name: Generate and build universal native ARM64 iOS app (no signing)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO 'TARGETED_DEVICE_FAMILY=1,2' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$PWD/build/W3DeviceIPA" \
            build > reports/xcodebuild-device.log 2>&1 || {
              tail -n 120 reports/xcodebuild-device.log
              exit 1
            }
      - name: Verify originals INSIDE compiled .app and package true IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/W3DeviceIPA/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP" && test -f "$APP/Info.plist"
          # This one-shot IPA includes the updated scrollable, accessible W3 menu.
          grep -q 'ScrollView(.vertical)' ASTEROIDYiOS/W3MainMenu568.swift
          grep -q 'minHeight:44' ASTEROIDYiOS/W3MainMenu568.swift
          grep -q 'accessibilityIdentifier("w3-home-navigation")' ASTEROIDYiOS/W3MainMenu568.swift
          python3 - "$APP" <<'PY' | tee reports/w3-bundled-original-hashes.txt
          from pathlib import Path
          import sys,plistlib,hashlib
          app=Path(sys.argv[1])
          info=plistlib.loads((app/"Info.plist").read_bytes())
          assert set(info["UIDeviceFamily"])=={1,2},info["UIDeviceFamily"]
          assert info["CFBundleSupportedPlatforms"]==["iPhoneOS"]
          expected={
              "W3Background568Original.dat":"a8aa28883084657f0c38900dbb011de09e2b0fd461704d370a68858be0178145",
              "W3Logo568Original.dat":"cab4198b953640c787975c5a8436a0fdeaa82502b40e000077ff055cc0709e09",
              "W3HomePlanet290OriginalGPU.bin":"e93a0bbafc9bb50a25726a828ada81f36675bf88d802c5a8f985b89b6dc96c1b",
              "W3HomePlanet290Base.dat":"4987f35cd6f021fd98794f406c641f4853c538a82b10625e6b79e860c8a787c0",
              "W3HomePlanet293Glow.dat":"6f1debd175f52b7ce1fbc687e9977597335ee432858d7d6d6e47cf66b5f9aa39",
              "Vanguard431Source.mesh":"f5d6d0107437fa54c3e8505f9adfbf6143cc877cb970eef687603609e26f9f4a",
              "Vanguard431Base.jpg":"2945f711a6b559bfb5fdfb79750a2f2f77e2071aa5f3f4173eb450bce81b8b95"
          }
          for name,digest in expected.items():
              found=list(app.rglob(name))
              assert len(found)==1,(name,found)
              actual=hashlib.sha256(found[0].read_bytes()).hexdigest()
              assert actual==digest,(name,actual)
              print("PASS original W3/device asset",name,len(found[0].read_bytes()))
          assert len(list(app.rglob("default.metallib")))==1
          print("PASS iPhone+iPad app and original v568 W3/Vanguard Metal resources")
          PY
          mkdir -p distribution/Payload
          cp -R "$APP" distribution/Payload/
          (cd distribution && zip -q -r -y ../ASTEROIDY_v568_W3_MENU_NAV_iPhone_iPad_UNSIGNED.ipa Payload)
          python3 Tools/verify_ipa.py ASTEROIDY_v568_W3_MENU_NAV_iPhone_iPad_UNSIGNED.ipa --require-vanguard-original | tee reports/ipa-verification.txt
          unzip -t ASTEROIDY_v568_W3_MENU_NAV_iPhone_iPad_UNSIGNED.ipa | tail -n 1 | tee -a reports/ipa-verification.txt
          shasum -a 256 ASTEROIDY_v568_W3_MENU_NAV_iPhone_iPad_UNSIGNED.ipa | tee reports/ipa-sha256.txt
          stat -f '%z bytes' ASTEROIDY_v568_W3_MENU_NAV_iPhone_iPad_UNSIGNED.ipa | tee reports/ipa-size.txt
      - name: Publish ACTUAL unsigned IPA and hash/proof
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-v568-W3-MENU-NAV-UNSIGNED-IPA-20261106
          path: |
            ASTEROIDY_v568_W3_MENU_NAV_iPhone_iPad_UNSIGNED.ipa
            reports/preflight-ios.txt
            reports/w3-menu-contract.txt
            reports/w3-source-ship-contract.txt
            reports/w3-bundled-original-hashes.txt
            reports/ipa-verification.txt
            reports/ipa-sha256.txt
            reports/ipa-size.txt
            reports/environment.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish build error diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-v568-W3-MENU-NAV-IPA-FAILURE-20261106
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
