name: ASTEROIDY iOS HUD v600 contracts
on:
  push:
    branches:
      - feature/ios-h55-v580-native-entry
    paths:
      - "ASTEROIDYiOS/HudMotion600.swift"
      - "ASTEROIDYiOS/HudLayout600.swift"
      - "ASTEROIDYiOS/HudLayoutEditor600.swift"
      - "ASTEROIDYiOS/HudLayoutDocument600.swift"
      - "ASTEROIDYiOS/HudWidgetPlacement600.swift"
      - "Tests/HudWidgetPlacement600Tests.swift"
      - "Tests/HudMotionLiveRenderer600Contract.py"
      - "ASTEROIDYiOS/CombatHUDViewport568.swift"
      - "ASTEROIDYiOS/HudLayoutMarker600.swift"
      - "ASTEROIDYiOS/HudWidgetGeometry600.swift"
      - "ASTEROIDYiOS/CarbonisCombat568.swift"
      - "ASTEROIDYiOS/CarbonisSession568.swift"
      - "Tests/HudMotionEventCounters600Contract.py"
      - "ASTEROIDYiOS/HudMissionGate600.swift"
      - "Tests/HudMissionGate600Tests.swift"
      - "Tests/HudMissionGate600Contract.py"
      - "Tests/HudV600StressTests.swift"
      - "Tests/HudLayout600Tests.swift"
      - "ASTEROIDYiOS/HudEnergy600.swift"
      - "ASTEROIDYiOS/HudCapsuleController600.swift"
      - "ASTEROIDYiOS/HudCapsuleBinding600.swift"
      - "ASTEROIDYiOS/HudPlanetariumAsset600.swift"
      - "ASTEROIDYiOS/HudPlanetariumTracks600.swift"
      - "ASTEROIDYiOS/HudPlanetariumScene600.swift"
      - "ASTEROIDYiOS/HudPlanetariumCorona600.swift"
      - "Tests/HudPlanetariumCorona600Tests.swift"
      - "Tests/HudPlanetariumCorona600Contract.py"
      - "ASTEROIDYiOS/Sector01Scene568.swift"
      - "ASTEROIDYiOS/HudPickupTransform600.swift"
      - "Tests/HudPickupTransform600Tests.swift"
      - "Tests/HudPickupMetal600Contract.py"
      - "Tests/HudPlanetariumIntegration600Contract.py"
      - "Tests/HudCapsuleBinding600Tests.swift"
      - "Tests/HudCapsuleController600Tests.swift"
      - "ASTEROIDYiOS/SourceCombatHUD331.swift"
      - "ASTEROIDYiOS/Assets/hud/default-layout.json"
      - "Tests/HudV600CoreTests.swift"
      - "Tests/HudV600IntegrationContract.py"
      - ".github/workflows/hud-v600-validation.yml"
  workflow_dispatch:
jobs:
  verify-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact PC v600 layout and active status renderer
        run: |
          python3 Tests/HudV600IntegrationContract.py
          python3 Tests/HudPlanetariumIntegration600Contract.py
          python3 Tests/HudPlanetariumCorona600Contract.py
          python3 Tests/HudMotionEventCounters600Contract.py
          python3 Tests/HudMotionLiveRenderer600Contract.py
          python3 Tests/HudMissionGate600Contract.py
          python3 Tests/HudPickupMetal600Contract.py
      - name: Compile and execute Swift motion and plasma reference contracts
        run: |
          set -euo pipefail
          swiftc ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/HudEnergy600.swift Tests/HudV600CoreTests.swift -o /tmp/hud-v600-core
          /tmp/hud-v600-core
          swiftc ASTEROIDYiOS/HudWidgetGeometry600.swift ASTEROIDYiOS/HudLayout600.swift Tests/HudLayout600Tests.swift -o /tmp/hud-v600-layout
          /tmp/hud-v600-layout
          swiftc ASTEROIDYiOS/CombatHUDViewport568.swift ASTEROIDYiOS/HudWidgetGeometry600.swift ASTEROIDYiOS/HudLayout600.swift ASTEROIDYiOS/HudWidgetPlacement600.swift Tests/HudWidgetPlacement600Tests.swift -o /tmp/hud-v600-placement
          /tmp/hud-v600-placement
          swiftc ASTEROIDYiOS/HudMissionGate600.swift Tests/HudMissionGate600Tests.swift -o /tmp/hud-v600-mission
          /tmp/hud-v600-mission
          swiftc ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/HudEnergy600.swift ASTEROIDYiOS/HudWidgetGeometry600.swift ASTEROIDYiOS/HudLayout600.swift Tests/HudV600StressTests.swift -o /tmp/hud-v600-stress
          /tmp/hud-v600-stress
          swiftc ASTEROIDYiOS/HudCapsuleController600.swift Tests/HudCapsuleController600Tests.swift -o /tmp/hud-v600-capsule
          /tmp/hud-v600-capsule
          swiftc ASTEROIDYiOS/HudCapsuleController600.swift ASTEROIDYiOS/HudCapsuleBinding600.swift Tests/HudCapsuleBinding600Tests.swift -o /tmp/hud-v600-bubble
          /tmp/hud-v600-bubble
  verify-ios-parser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse active HUD view with Swift compiler
        run: |
          swiftc -frontend -parse ASTEROIDYiOS/SourceCombatHUD331.swift
          swiftc -frontend -parse ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/HudEnergy600.swift
          swiftc -frontend -parse ASTEROIDYiOS/HudPlanetariumAsset600.swift ASTEROIDYiOS/HudPlanetariumTracks600.swift ASTEROIDYiOS/HudPlanetariumScene600.swift
          swiftc -frontend -parse ASTEROIDYiOS/Sector01Scene568.swift ASTEROIDYiOS/HudLayoutEditor600.swift ASTEROIDYiOS/HudLayoutMarker600.swift ASTEROIDYiOS/HudLayoutDocument600.swift
          swiftc ASTEROIDYiOS/HudPlanetariumCorona600.swift Tests/HudPlanetariumCorona600Tests.swift -o /tmp/hud-v600-corona
          /tmp/hud-v600-corona
          swiftc -O ASTEROIDYiOS/SourcePickupModels586.swift ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/CombatHUDViewport568.swift ASTEROIDYiOS/HudWidgetGeometry600.swift ASTEROIDYiOS/HudLayout600.swift ASTEROIDYiOS/HudWidgetPlacement600.swift ASTEROIDYiOS/HudPickupTransform600.swift Tests/HudPickupTransform600Tests.swift -o /tmp/hud-v600-icons
          /tmp/hud-v600-icons
