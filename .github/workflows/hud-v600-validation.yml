name: ASTEROIDY iOS HUD v600 contracts
on:
  push:
    branches:
      - feature/ios-h55-v580-native-entry
    paths:
      - "ASTEROIDYiOS/HudMotion600.swift"
      - "ASTEROIDYiOS/HudEnergy600.swift"
      - "ASTEROIDYiOS/HudCapsuleController600.swift"
      - "ASTEROIDYiOS/HudCapsuleBinding600.swift"
      - "ASTEROIDYiOS/HudPlanetariumAsset600.swift"
      - "ASTEROIDYiOS/HudPlanetariumTracks600.swift"
      - "ASTEROIDYiOS/HudPlanetariumScene600.swift"
      - "ASTEROIDYiOS/Sector01Scene568.swift"
      - "ASTEROIDYiOS/HudPickupTransform600.swift"
      - "Tests/HudPickupTransform600Tests.swift"
      - "Tests/HudPickupMetal600Contract.py"
      - "Tests/HudPlanetariumIntegration600Contract.py"
      - "Tests/HudCapsuleBinding600Tests.swift"
      - "Tests/HudCapsuleController600Tests.swift"
      - "ASTEROIDYiOS/SourceCombatHUD331.swift"
      - "ASTEROIDYiOS/Assets/hud/default-layout.json"
      - "Tests/HudV600CoreTests.swift"
      - "Tests/HudV600IntegrationContract.py"
      - ".github/workflows/hud-v600-validation.yml"
  workflow_dispatch:
jobs:
  verify-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact PC v600 layout and active status renderer
        run: |
          python3 Tests/HudV600IntegrationContract.py
          python3 Tests/HudPlanetariumIntegration600Contract.py
          python3 Tests/HudPickupMetal600Contract.py
      - name: Compile and execute Swift motion and plasma reference contracts
        run: |
          set -euo pipefail
          swiftc ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/HudEnergy600.swift Tests/HudV600CoreTests.swift -o /tmp/hud-v600-core
          /tmp/hud-v600-core
          swiftc ASTEROIDYiOS/HudCapsuleController600.swift Tests/HudCapsuleController600Tests.swift -o /tmp/hud-v600-capsule
          /tmp/hud-v600-capsule
          swiftc ASTEROIDYiOS/HudCapsuleController600.swift ASTEROIDYiOS/HudCapsuleBinding600.swift Tests/HudCapsuleBinding600Tests.swift -o /tmp/hud-v600-bubble
          /tmp/hud-v600-bubble
  verify-ios-parser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse active HUD view with Swift compiler
        run: |
          swiftc -frontend -parse ASTEROIDYiOS/SourceCombatHUD331.swift
          swiftc -frontend -parse ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/HudEnergy600.swift
          swiftc -frontend -parse ASTEROIDYiOS/HudPlanetariumAsset600.swift ASTEROIDYiOS/HudPlanetariumTracks600.swift ASTEROIDYiOS/HudPlanetariumScene600.swift
          swiftc -frontend -parse ASTEROIDYiOS/Sector01Scene568.swift
          swiftc -O ASTEROIDYiOS/SourcePickupModels586.swift ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/HudPickupTransform600.swift Tests/HudPickupTransform600Tests.swift -o /tmp/hud-v600-icons
          /tmp/hud-v600-icons
