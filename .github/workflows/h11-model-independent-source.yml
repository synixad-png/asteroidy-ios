name: H11 PC580 model-independent source mechanics parity
on:
  push:
    branches: [feature/ios-h55-v580-native-entry]
    paths:
      - 'ASTEROIDYiOS/H55SourceMechanics580.swift'
      - 'ASTEROIDYiOS/H55Workshop580.swift'
      - 'Tests/H55SourceMechanics580Tests.swift'
      - '.github/workflows/h11-model-independent-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-parity:
    name: Source v580 six-ship/modules/trophies exact rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run original PC580 source-derived test fixtures
        shell: bash
        run: |
          set -euo pipefail
          swiftc -O \
            ASTEROIDYiOS/Sector01Shop568.swift \
            ASTEROIDYiOS/H55Workshop580.swift \
            ASTEROIDYiOS/H55SourceMechanics580.swift \
            Tests/H55SourceMechanics580Tests.swift \
            -o /tmp/h11-pc580-source-models
          /tmp/h11-pc580-source-models
          swiftc -O \
            ASTEROIDYiOS/Sector01Shop568.swift \
            ASTEROIDYiOS/H55Workshop580.swift \
            Tests/H55Workshop580Tests.swift \
            -o /tmp/h11-existing-service
          /tmp/h11-existing-service
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ASTEROIDYiOS/H55SourceMechanics580.swift").read_text()
          assert '245*a[type]' in p and '390*s[type]' in p
          assert 'wallet.tokens-=cost' in p and 'wallet.totalSpent=addCapped' in p
          assert 'guard state.valid' in p
          assert 'state.timeTrophies |= bit' in p
          assert 'id<3 || state.guardianOwned' in p
          assert 'case 5:return 620' in p
          assert 'guard id==1 else{return nil}' in p
          print("PASS H11 original source contracts, no fake purchased GLB")
          PY
