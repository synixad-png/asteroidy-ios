name: ASTEROIDY iOS - Source assets and XcodeGen preflight (NO IPA)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ios-inputs.yml'
      - 'Tools/verify_ios_inputs.py'
      - 'SOURCES_SHA256SUMS.txt'
      - 'project.yml'
      - 'ASTEROIDYiOS/Assets/**'
      - 'ASTEROIDYiOS/Ship.metal'
      - 'ASTEROIDYiOS/App.swift'
      - 'ASTEROIDYiOS/MetalRenderer.swift'
      - 'ASTEROIDYiOS/IntroOrbit41.swift'
      - 'ASTEROIDYiOS/SourceFighterToon60.swift'
      - 'ASTEROIDYiOS/SourceVanguardMesh431.swift'
      - 'Tests/SourceVanguardMesh431Tests.swift'
      - 'Tests/SourceVanguardTextureContract431.py'
      - 'Tools/verify_original_vanguard_resources.py'
      - 'Tests/ReleaseGateVanguard431Tests.py'
      - 'Tests/OriginalVanguard431InstalledAssetsTests.py'
      - 'Tools/prepare_vanguard431_assets.py'
      - 'Tests/PrepareVanguardPackTests.py'
      - 'Tools/run_original_ios_simulator_capture.py'
      - 'Tests/SimulatorSmokeHarnessTests.py'
      - 'Tools/verify_simulator_render_snapshot.swift'
      - 'Tools/verify_ipa.py'
      - '.github/workflows/build-ios-iphone-ipad-manual.yml'
      - 'Tests/SourceFighterToon60Tests.swift'
      - 'Tests/SourceFighterToonContract60.py'
      - 'ASTEROIDYiOS/IntroEnginePlasma491.swift'
      - 'Tests/IntroEnginePlasma491Tests.swift'
      - 'Tests/IntroEnginePlasmaSourceContract491.py'
      - 'ASTEROIDYiOS/IntroVanguard431.swift'
      - 'Tests/IntroVanguard431Tests.swift'
      - 'Tests/IntroVanguardSourceContract431.py'
      - 'ASTEROIDYiOS/IntroAtmosphere47.swift'
      - 'Tests/IntroAtmosphere47Tests.swift'
      - 'Tests/IntroAtmosphereSourceContract47.py'
      - 'ASTEROIDYiOS/IntroRockGeometry41.swift'
      - 'Tests/IntroRockGeometry41Tests.swift'
      - 'Tests/IntroOrbit41Tests.swift'
      - 'Tests/IntroOrbitSourceContract41.py'
      - 'Tests/IntroBoreasMorphSourceContract556.py'
      - 'Tests/SourceSceneStartupContract556.py'
      - '.github/workflows/build-ios-iphone-ipad-manual.yml'
      - 'Tools/verify_ipa.py'

jobs:
  original-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact original v556 SHA256 and binary resource formats
        run: python3 Tools/verify_ios_inputs.py
      - name: Validate actual original Vanguard431 source mesh, BaseColor and ALL 194427 UVs
        run: |
          set -euo pipefail
          python3 Tests/OriginalVanguard431InstalledAssetsTests.py
          python3 Tools/verify_original_vanguard_resources.py --assets ASTEROIDYiOS/Assets
      - name: Guard v556 Boreas default scene, flat diagnostic and both iOS device families
        run: python3 Tests/SourceSceneStartupContract556.py
      - name: Swift frontend parse of current iPhone/iPad Metal scene (syntax only)
        run: |
          swiftc -frontend -parse ASTEROIDYiOS/App.swift
          swiftc -frontend -parse ASTEROIDYiOS/MetalRenderer.swift
          swiftc -frontend -parse ASTEROIDYiOS/IntroOrbit41.swift
          swiftc -frontend -parse ASTEROIDYiOS/SourceFighterToon60.swift
          swiftc -frontend -parse ASTEROIDYiOS/SourceVanguardMesh431.swift
          swiftc -frontend -parse ASTEROIDYiOS/IntroEnginePlasma491.swift
          swiftc -frontend -parse ASTEROIDYiOS/IntroVanguard431.swift
          swiftc -frontend -parse ASTEROIDYiOS/IntroRockGeometry41.swift
          swiftc -frontend -parse ASTEROIDYiOS/IntroAtmosphere47.swift
          python3 Tests/IntroOrbitSourceContract41.py
          python3 Tests/IntroBoreasMorphSourceContract556.py
          python3 Tests/IntroAtmosphereSourceContract47.py
          python3 Tests/IntroVanguardSourceContract431.py
          python3 Tests/IntroEnginePlasmaSourceContract491.py
          python3 Tests/SourceFighterToonContract60.py
          python3 Tests/SourceVanguardTextureContract431.py
          python3 Tests/ReleaseGateVanguard431Tests.py
          python3 Tests/PrepareVanguardPackTests.py
          python3 -m py_compile Tools/run_original_ios_simulator_capture.py
          python3 Tests/SimulatorSmokeHarnessTests.py
