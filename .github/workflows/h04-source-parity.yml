name: H04 source parity export and standalone test
on:
  push:
    branches: [feature/ios-h55-v580-native-entry]
    paths: [.github/workflows/h04-source-parity.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export authenticated code for 126MB user GLB differential
        uses: actions/upload-artifact@v4
        with:
          name: H04-SOURCE-PARITY
          path: |
            ASTEROIDYiOS/H55CollisionGeometry580.swift
            ASTEROIDYiOS/H55SpatialSupport580.swift
            ASTEROIDYiOS/H55TriangleBody580.swift
            Tests/H55TriangleBody580Tests.swift
          retention-days: 1
      - name: Run exact 4 sphere source regression
        run: |
          set -euo pipefail
          swiftc ASTEROIDYiOS/H55CollisionGeometry580.swift ASTEROIDYiOS/H55SpatialSupport580.swift ASTEROIDYiOS/H55TriangleBody580.swift Tests/H55TriangleBody580Tests.swift -o /tmp/h04
          /tmp/h04
