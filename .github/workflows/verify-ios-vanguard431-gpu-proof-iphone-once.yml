# Real ASTEROIDY simulator GPU screenshot verification with hard deadlines.
# Independent one-shot: creation triggers exactly one new Apple CI run.
# No IPA, mock game, fake screenshot or added source asset is generated.
name: ASTEROIDY iOS - real Vanguard431 iPhone GPU completed draw proof (NO IPA)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ios-vanguard431-gpu-proof-iphone-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-actual-render:
    name: Actual source Vanguard431 iPhone GPU drawn + screenshot, arm64 sim (NO IPA)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect real PC v568 Vanguard mesh and glTF skin
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 Tests/OriginalVanguard431InstalledAssetsTests.py | tee reports/source-assets.txt
          python3 Tools/verify_original_vanguard_resources.py --assets ASTEROIDYiOS/Assets | tee -a reports/source-assets.txt
          python3 Tests/SimulatorSmokeHarnessTests.py | tee reports/watchdog-self-test.txt
          swift Tools/verify_simulator_render_snapshot.swift --self-test | tee reports/pixels-self-test.txt
      - name: Generate exact native iOS game project
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Build real user's source Metal app for Apple simulator
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$PWD/build/Simulator431Watchdog" \
            build > reports/xcodebuild.log 2>&1 || {
              tail -n 150 reports/xcodebuild.log
              exit 1
            }
          APP=$(find build/Simulator431Watchdog/Build/Products/Debug-iphonesimulator \
                 -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          python3 - "$APP" <<'PY' | tee reports/compiled-simulator-asset-check.txt
          import sys,pathlib,hashlib,plistlib
          app=pathlib.Path(sys.argv[1])
          source=pathlib.Path("ASTEROIDYiOS/Assets")
          info=plistlib.loads((app/"Info.plist").read_bytes())
          assert set(info.get("UIDeviceFamily",[]))=={1,2}
          assert info.get("CFBundleIdentifier")=="com.synixad.asteroidyios"
          for name in ("Vanguard431Source.mesh","Vanguard431Base.jpg"):
              matches=list(app.rglob(name))
              assert len(matches)==1,(name,matches)
              assert hashlib.sha256(matches[0].read_bytes()).digest()==\
                     hashlib.sha256((source/name).read_bytes()).digest()
          assert len(list(app.rglob("default.metallib")))==1
          print("PASS: true source Vanguard431 + UV texture, both iOS")
          print("      simulator device families and genuine .metallib bundled")
          PY
      - name: Real iPhone simulator render, native completed-Metal-draw proof
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          APP=$(find build/Simulator431Watchdog/Build/Products/Debug-iphonesimulator \
                 -maxdepth 1 -type d -name '*.app' -print -quit)
          # Python subprocess enforces a separate timeout per simctl
          # operation. If CoreSimulator hangs, FAIL INCONCLUSIVE
          # rather than misleadingly claiming a game GPU regression.
          python3 -u Tools/run_original_ios_simulator_capture.py \
            --app "$APP" --reports reports --only IPHONE | tee reports/simulator-render.txt
          echo "PASS: real source ASTEROIDY iPhone simulator screenshot + completed GPU draw verified"
          echo "LIMIT: Apple iPhone simulator GPU; iPad simulator and physical devices not checked in this run"
      - name: Upload diagnostics, including ONLY verified genuine screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-iOS-iPhone-GPU-draw-proof-and-genuine-screen-NO-IPA
          path: |
            reports/source-assets.txt
            reports/watchdog-self-test.txt
            reports/pixels-self-test.txt
            reports/xcodebuild.log
            reports/compiled-simulator-asset-check.txt
            reports/selected-devices.json
            reports/simulator-render.txt
            reports/*_boot.txt
            reports/*_bootstatus.txt
            reports/*_install.txt
            reports/*_launch.txt
            reports/*_screenshot.txt
            reports/*_source-load.log
            reports/*_app-container.txt
            reports/*_GPU_source431_proof.json
            reports/*_real_pixels.txt
            reports/*_VERIFIED_ASTEROIDY_source431.png
          if-no-files-found: ignore
          retention-days: 7
