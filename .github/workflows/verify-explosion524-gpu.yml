name: ASTEROIDY iOS - Explosion524 GPU compilation (no IPA)
on:
  push:
    branches:
      - fix/iphone-explosion524-gpu-cost
    paths:
      - '.github/workflows/verify-explosion524-gpu.yml'
      - 'ASTEROIDYiOS/CarbonisExplosion524Renderer.swift'
      - 'ASTEROIDYiOS/Sector01Explosion524.metal'
  workflow_dispatch:

jobs:
  verify-explosion-524:
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Parse changed Swift and compile explosion shader for iphoneos
        run: |
          set -euo pipefail
          swiftc -frontend -parse ASTEROIDYiOS/CarbonisExplosion524Renderer.swift
          xcrun -sdk iphoneos metal -c ASTEROIDYiOS/Sector01Explosion524.metal -o /tmp/Sector01Explosion524.air
          test -s /tmp/Sector01Explosion524.air
      - name: Prepare native original assets and Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 Tools/prepare_v568_carbonis_sector01.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/prepare_v568_w3_home_planet290.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/prepare_v568_w3_original_assets.py --root . --destination ASTEROIDYiOS/Assets
          xcodegen generate
      - name: Compile complete device application (no IPA created)
        run: |
          set -euo pipefail
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build build
      - name: Record honest CI result for branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branch='fix/iphone-explosion524-gpu-cost';
            const path='Reports/EXPLOSION_GPU_COMPILATION.md';
            const body=[
              '# Explosion524 GPU source compilation',
              '',
              'Status: ${{ job.status }}',
              'Run ID: '+context.runId,
              'Source commit: '+context.sha,
              'Run URL: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
              'Coverage: native Apple Metal shader, Swift parse, full iPhone device build; no IPA',
              'Physical iPhone performance/visual validation: NOT DONE'
            ].join('\n')+'\n';
            let sha;
            try {
              const old=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data;
              sha=old.sha;
            } catch(error) {
              if(error.status!==404) core.warning(String(error));
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch,sha,
              content:Buffer.from(body).toString('base64'),
              message:'Record Explosion524 native Metal/Xcode compile outcome'
            });
