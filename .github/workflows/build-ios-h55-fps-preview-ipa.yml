# Single authoritative release: original PC v602 planetarium is versioned
# and embedded during CI BEFORE the IPA is published.
# No downloading an incomplete artifact and patching it locally afterward.
name: ASTEROIDY iOS - PC v602 HUD - kompletna Release IPA
# Avoid launching another obsolete full IPA build after every small patch.
# GitHub retains only the latest queued/running run within this workflow
# and branch; the newest commit is always the authoritative candidate.
concurrency:
  group: ios-hud-v602-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feature/ios-h55-v580-native-entry]
    paths:
      - .github/workflows/build-ios-h55-fps-preview-ipa.yml
      - ASTEROIDYiOS/HudLayoutEditor600.swift
      - ASTEROIDYiOS/HudEditorGeometry.swift
      - Tests/HudEditorGeometryTests.swift
      - ASTEROIDYiOS/HudEditorGeometry.swift
      - ASTEROIDYiOS/HudPlanetariumAsset600.swift
      - ASTEROIDYiOS/Sector01Scene568.swift
      - ASTEROIDYiOS/H55FPSLighting580.swift
      - ASTEROIDYiOS/CarbonisVisualSettingsPanel568.swift
      - ASTEROIDYiOS/HudEnergy600.swift
      - ASTEROIDYiOS/HudPlasmaLayer600.swift
      - Tests/HudPlasmaIndependent600Tests.swift
      - Tests/HudPlanetariumBubbleWrapTests.swift
      - Tests/HudPlasmaIndependent600Contract.py
      - Tests/HudV602TouchRuntimeContract.py
      - Tests/HudLayout600Contract.py
      - Tests/HudMotionLiveRenderer600Contract.py
      - Tests/HudSmoothRadar600Contract.py
      - Tests/HudPlanetariumIntegration600Contract.py
      - Tests/HudPickupMetal600Contract.py
      - Tests/HudPlasmaLive600Contract.py
      - Tests/HudPlanetariumCorona600Contract.py
      - Tests/HudV600IntegrationContract.py
      - Tests/IOSOriginalCombatHUD331Contract.py
      - Tests/PC586InputIntegrationContract.py
      - Tests/PC586IntegrationContract.py
      - ASTEROIDYiOS/CarbonisSession568.swift
      - ASTEROIDYiOS/Sector01CarbonisPreview568.swift
      - ASTEROIDYiOS/HudPlanetariumHost600.swift
      - ASTEROIDYiOS/HudPlanetariumProjection.swift
      - Tests/HudPlanetariumProjectionTests.swift
      - ASTEROIDYiOS/HudPlanetariumScene600.swift
      - ASTEROIDYiOS/HudPlanetariumOriginalMetal600.swift
      - ASTEROIDYiOS/HudPlanetariumMetal600.swift
      - ASTEROIDYiOS/HudPlanetariumMetal600.metal
      - ASTEROIDYiOS/HudPlanetariumGLTFImport.swift
      - Tests/HudPlanetariumGLTFImportContract.py
      - Tests/HudPlanetariumGLTFImportTests.swift
      - SourceResources/PC602/planetarium.glb.xz
      - Tools/stage_pc602_planetarium.py
      - Tools/verify_pc602_planetarium_ipa.py
      - ASTEROIDYiOS/HudCapsuleController600.swift
      - ASTEROIDYiOS/SourceCombatHUD331.swift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-full:
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Confirm source PC v600 combat HUD and original H55 FPS material contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 Tests/H55FPSPreviewDepth580Contract.py | tee reports/fps-source.txt
          python3 Tests/HudLayout600Contract.py | tee reports/hud-touch-v602.txt
          python3 Tests/HudV602TouchRuntimeContract.py | tee -a reports/hud-touch-v602.txt
          python3 Tests/HudV600IntegrationContract.py | tee reports/hud-v600-source.txt
          python3 Tests/HudPlasmaLive600Contract.py | tee -a reports/hud-v600-source.txt
          python3 Tests/HudPlasmaIndependent600Contract.py | tee -a reports/hud-v600-source.txt
          python3 Tests/IOSOriginalCombatHUD331Contract.py | tee -a reports/hud-v600-source.txt
          python3 Tests/HudMotionLiveRenderer600Contract.py | tee -a reports/hud-v600-source.txt
          python3 Tests/HudSmoothRadar600Contract.py | tee -a reports/hud-v600-source.txt
          python3 Tests/HudPlanetariumIntegration600Contract.py | tee -a reports/hud-v600-source.txt
          python3 Tests/HudPlanetariumGLTFImportContract.py | tee -a reports/hud-v600-source.txt
          python3 Tests/HudPickupMetal600Contract.py | tee -a reports/hud-v600-source.txt
          python3 Tests/HudPlanetariumCorona600Contract.py | tee -a reports/hud-v600-source.txt
          python3 Tests/HudLayout600Contract.py | tee -a reports/hud-v600-source.txt
          python3 Tests/HudMotionEventCounters600Contract.py | tee -a reports/hud-v600-source.txt
          python3 Tests/H55FPSOriginalMaterial580Tests.py | tee -a reports/fps-source.txt
          # Validate final 352x198/16:9 preview and isolated depth source.
          swiftc -frontend -parse ASTEROIDYiOS/HudLayoutEditor600.swift ASTEROIDYiOS/HudEditorGeometry.swift
          swiftc -frontend -parse ASTEROIDYiOS/HudPlanetariumAsset600.swift ASTEROIDYiOS/HudPlanetariumProjection.swift ASTEROIDYiOS/HudPlanetariumScene600.swift ASTEROIDYiOS/HudPlanetariumHost600.swift ASTEROIDYiOS/Sector01Scene568.swift
          swiftc -typecheck ASTEROIDYiOS/HudPlanetariumOriginalMetal600.swift ASTEROIDYiOS/HudPlanetariumMetal600.swift ASTEROIDYiOS/HudEnergy600.swift ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/HudMotionProject600.swift ASTEROIDYiOS/HudPlanetariumAsset600.swift ASTEROIDYiOS/HudPlanetariumProjection.swift ASTEROIDYiOS/HudCapsuleController600.swift ASTEROIDYiOS/HudWidgetGeometry600.swift ASTEROIDYiOS/HudLayout600.swift ASTEROIDYiOS/HudWidgetPlacement600.swift ASTEROIDYiOS/CombatHUDViewport568.swift
          swiftc -frontend -parse ASTEROIDYiOS/HudEnergy600.swift ASTEROIDYiOS/HudPlasmaLayer600.swift ASTEROIDYiOS/SourceCombatHUD331.swift
          swiftc -frontend -parse ASTEROIDYiOS/H55FPSSettingsSection580.swift
          swiftc -frontend -parse ASTEROIDYiOS/H55FPSPreview580.swift
          swiftc -frontend -parse ASTEROIDYiOS/H55FPSOverlayViewport580.swift
          swiftc -frontend -parse ASTEROIDYiOS/H55FPSLighting580.swift
          swiftc -frontend -parse ASTEROIDYiOS/SourceCombatHUD331.swift ASTEROIDYiOS/HudPlasmaLayer600.swift ASTEROIDYiOS/HudPlanetariumHost600.swift
          swiftc -frontend -parse ASTEROIDYiOS/HudIconMotion600.swift ASTEROIDYiOS/HudMotionProject600.swift ASTEROIDYiOS/HudPickupTransform600.swift ASTEROIDYiOS/Sector01Scene568.swift
          swiftc ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/HudIconMotion600.swift Tests/HudIconMotion600Tests.swift -o /tmp/hud-icon-springs
          /tmp/hud-icon-springs | tee -a reports/hud-v600-source.txt
          swiftc ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/HudMotionProject600.swift Tests/HudMotionProject600Tests.swift -o /tmp/hud-icon-projection
          /tmp/hud-icon-projection | tee -a reports/hud-v600-source.txt
          swiftc ASTEROIDYiOS/CombatHUDViewport568.swift ASTEROIDYiOS/HudWidgetGeometry600.swift ASTEROIDYiOS/HudLayout600.swift ASTEROIDYiOS/HudEditorGeometry.swift Tests/HudEditorGeometryTests.swift -o /tmp/hud-editor-geometry
          /tmp/hud-editor-geometry | tee -a reports/hud-touch-v602.txt
          swiftc ASTEROIDYiOS/CombatHUDViewport568.swift ASTEROIDYiOS/HudWidgetGeometry600.swift ASTEROIDYiOS/HudLayout600.swift ASTEROIDYiOS/HudWidgetPlacement600.swift ASTEROIDYiOS/HudPlanetariumProjection.swift Tests/HudPlanetariumProjectionTests.swift -o /tmp/hud-planetarium-screen
          /tmp/hud-planetarium-screen | tee -a reports/hud-touch-v602.txt
          swiftc ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/HudMotionProject600.swift ASTEROIDYiOS/CombatHUDViewport568.swift ASTEROIDYiOS/HudWidgetGeometry600.swift ASTEROIDYiOS/HudLayout600.swift Tests/HudPlasmaIndependent600Tests.swift -o /tmp/hud-plasma-independent
          /tmp/hud-plasma-independent | tee -a reports/hud-v600-source.txt
          swiftc ASTEROIDYiOS/HudPlanetariumOriginalMetal600.swift ASTEROIDYiOS/HudPlanetariumAsset600.swift ASTEROIDYiOS/HudCapsuleController600.swift Tests/HudPlanetariumBubbleWrapTests.swift -o /tmp/hud-planetarium-bubble
          /tmp/hud-planetarium-bubble | tee -a reports/hud-v600-source.txt
          swiftc ASTEROIDYiOS/HudMotion600.swift ASTEROIDYiOS/HudEnergy600.swift Tests/HudV600CoreTests.swift -o /tmp/hud-v600-source-core
          /tmp/hud-v600-source-core | tee -a reports/hud-v600-source.txt
          swiftc ASTEROIDYiOS/HudCapsuleController600.swift Tests/HudCapsuleController600Tests.swift -o /tmp/hud-v600-source-capsules
          /tmp/hud-v600-source-capsules | tee -a reports/hud-v600-source.txt
          swiftc -O ASTEROIDYiOS/H55FPSPose580.swift Tests/H55FPSPose580Tests.swift -o /tmp/h55-fps-source
          /tmp/h55-fps-source | tee -a reports/fps-source.txt
          python3 Tools/verify_ios_inputs.py | tee reports/preflight.txt
          python3 Tools/prepare_vanguard431_assets.py | tee reports/vanguard.txt
          python3 Tools/verify_original_vanguard_resources.py --assets ASTEROIDYiOS/Assets | tee reports/vanguard-check.txt
      - name: Reconstruct all genuine v568 game assets BEFORE generating Xcode project
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/stage_v568_resources.py --verify-only | tee reports/v568-source.txt
          python3 Tools/prepare_v568_carbonis_sector01.py --root . --destination ASTEROIDYiOS/Assets | tee reports/carbonis.txt
          python3 Tools/prepare_v568_w3_home_planet290.py --root . --destination ASTEROIDYiOS/Assets | tee reports/home290.txt
          python3 Tools/prepare_v568_player_ship_ios.py --root . --destination ASTEROIDYiOS/Assets | tee reports/player367.txt
          python3 Tools/prepare_v568_w3_original_assets.py --root . --destination ASTEROIDYiOS/Assets --required | tee reports/w3-menu.txt
          python3 Tools/materialize_pc586_original_resources.py --source SourceResources/PC586 --report reports/original-pc586.json | tee reports/pc586-source.txt
          # Source PC v602: stage the single byte-verified original BEFORE xcodegen.
          # Missing source, modified geometry or incorrect 159-channel clip is fatal.
          python3 Tools/stage_pc602_planetarium.py | tee reports/planetarium-pc602-source.txt
          # Compile and execute the actual Swift importer boundary with
          # the SHA-verified, original PC602 binary. The copy must differ
          # only in 12 glTF COLOR_0 metadata flags, never in BIN data.
          swiftc ASTEROIDYiOS/HudPlanetariumAsset600.swift ASTEROIDYiOS/HudPlanetariumGLTFImport.swift Tests/HudPlanetariumGLTFImportTests.swift -o /tmp/pc602-gltf-import
          /tmp/pc602-gltf-import ASTEROIDYiOS/Assets/planetarium.glb | tee reports/planetarium-pc602-import.txt
          test -f ASTEROIDYiOS/Assets/planetarium.glb
      - name: Build genuine iOS ARM64 Release with all restored original v568 resources
        shell: bash
        run: |
          set -euo pipefail
          { echo "Git commit: $GITHUB_SHA"; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; } | tee reports/build-env.txt
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO 'TARGETED_DEVICE_FAMILY=1,2' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$PWD/build/H55FPS" \
            build >reports/xcodebuild.log 2>&1 || {
              tail -n 160 reports/xcodebuild.log
              exit 1
            }
      - name: Verify exact PC v602 original planetarium is embedded in compiled .app
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/H55FPS/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP" && test -f "$APP/Info.plist"
          test -f "$APP/planetarium.glb"
          python3 - "$APP/planetarium.glb" <<'PY' | tee reports/planetarium-pc602-app.txt
          from pathlib import Path
          import hashlib,sys
          from Tools.stage_pc602_planetarium import SIZE,SHA256,verified_bytes
          model=Path(sys.argv[1]).read_bytes()
          assert len(model)==SIZE and hashlib.sha256(model).hexdigest()==SHA256
          assert model==verified_bytes()
          print('PASS original PC v602 planetarium embedded at .app root: SHA256',SHA256)
          PY
      - name: Verify and embed all 15 exact PC586 H55 hands/EXP-01/pickup resources
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/H55FPS/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP" && test -f "$APP/Info.plist"
          python3 Tools/materialize_pc586_original_resources.py \
            --source SourceResources/PC586 --app "$APP" --report reports/pc586-embedded.json
          python3 - "$APP" <<'PY' | tee reports/all-asset-coverage.txt
          from pathlib import Path
          import json,sys
          app=Path(sys.argv[1]); asset=Path("ASTEROIDYiOS/Assets")
          expected=[
           "Sector01CarbonisVertices.bin","Sector01CarbonisIndices.bin",
           "Sector01CarbonisHeightMap.dat","Sector01CarbonisBase.dat",
           "Sector01CarbonisEmissive.dat","Sector01CarbonisIrradiance.dat",
           "Sector01CarbonisSource.json","W3HomePlanet290OriginalGPU.bin",
           "W3HomePlanet290Base.dat","W3HomePlanet293Glow.dat",
           "W3HomePlanet290Source.json","PlayerShip367OriginalGPU.bin",
           "PlayerShip363Base.jpg","PlayerShip367Source.json",
           "W3Background568Original.dat","W3Logo568Original.dat",
          ]
          for name in expected:
              assert (asset/name).is_file(), name
              assert (app/name).is_file(), "Compiled app missing original: "+name
              assert (asset/name).read_bytes()==(app/name).read_bytes(),name
          assert len(expected)==16
          print("PASS original v568 game assets:",len(expected))
          print("PASS original PC586 models verified separately: 15")
          PY
      - name: Package and prove final iPhone/iPad unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/H55FPS/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -q -r -y ../ASTEROIDY_iOS_PC602_KOMPLETNA_UNSIGNED.ipa Payload)
          python3 Tools/verify_ipa.py ASTEROIDY_iOS_PC602_KOMPLETNA_UNSIGNED.ipa --require-vanguard-original | tee reports/ipa-native.txt
          python3 Tools/verify_pc586_complete_ipa.py ASTEROIDY_iOS_PC602_KOMPLETNA_UNSIGNED.ipa | tee reports/ipa-models.json
          python3 Tools/verify_pc602_planetarium_ipa.py ASTEROIDY_iOS_PC602_KOMPLETNA_UNSIGNED.ipa | tee reports/planetarium-pc602-ipa.txt
          unzip -t ASTEROIDY_iOS_PC602_KOMPLETNA_UNSIGNED.ipa | tail -1 | tee reports/ipa-crc.txt
          shasum -a 256 ASTEROIDY_iOS_PC602_KOMPLETNA_UNSIGNED.ipa | tee reports/SHA256SUMS.txt
          stat -f '%z bytes' ASTEROIDY_iOS_PC602_KOMPLETNA_UNSIGNED.ipa | tee reports/ipa-size.txt
          python3 - <<'PY' | tee reports/required-source-assets.txt
          import zipfile,plistlib
          from pathlib import Path
          p=Path("ASTEROIDY_iOS_PC602_KOMPLETNA_UNSIGNED.ipa")
          assert p.stat().st_size>30_000_000, "ABORT: truncated asset bundle; never publish 11MB IPA again"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              root="Payload/ASTEROIDY iOS.app/"
              assert len([n for n in names if n.startswith(root)])>=75, "Incomplete source assets"
              for name in ("gloves_parted.glb","gloves_combined.glb","EXP01_SOURCE_v601.glb",
                           "planetarium.glb",
                           "boost.glb","shield.glb","energy.glb","bomb.glb",
                           "Sector01CarbonisVertices.bin","W3HomePlanet290OriginalGPU.bin"):
                  assert root+name in names, "Missing source GLB/texture: "+name
          print("PASS native complete-resource IPA: original H55 hands/weapon, four pickups, combat and W3 assets")
          PY
      - name: Publish actual full-source native IPA
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-iOS-PC602-KOMPLETNA-IPA
          path: |
            ASTEROIDY_iOS_PC602_KOMPLETNA_UNSIGNED.ipa
            reports/preflight.txt
            reports/fps-source.txt
            reports/hud-v600-source.txt
            reports/hud-touch-v602.txt
            reports/all-asset-coverage.txt
            reports/pc586-embedded.json
            reports/build-env.txt
            reports/ipa-native.txt
            reports/planetarium-pc602-source.txt
            reports/planetarium-pc602-import.txt
            reports/planetarium-pc602-app.txt
            reports/planetarium-pc602-ipa.txt
            reports/ipa-models.json
            reports/SHA256SUMS.txt
            reports/ipa-size.txt
            reports/ipa-crc.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish failure diagnostics without false IPA
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-iOS-H55-FPS-BUILD-FAILURE
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
