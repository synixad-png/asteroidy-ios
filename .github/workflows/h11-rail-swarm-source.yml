name: H11 PC580 source weapons and consumables parity
on:
  push:
    branches: [feature/ios-h55-v580-native-entry]
    paths:
      - 'ASTEROIDYiOS/Sector01Shop568.swift'
      - 'ASTEROIDYiOS/H55Workshop580.swift'
      - 'ASTEROIDYiOS/H55WorkshopPanel580.swift'
      - 'ASTEROIDYiOS/CarbonisCombat568.swift'
      - 'ASTEROIDYiOS/CarbonisSession568.swift'
      - 'ASTEROIDYiOS/Sector01ShopPanel568.swift'
      - 'Tests/H55Workshop580Tests.swift'
      - 'Tests/H11RailSwarm580Tests.swift'
      - 'Tests/H11Consumables580Tests.swift'
      - 'Tests/Sector01MissionFinish568Tests.swift'
      - 'ASTEROIDYiOS/Sector01Scene568.swift'
      - '.github/workflows/h11-rail-swarm-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weapon-source:
    name: PC580 weapons, ions, bombs, save migration and real collisions
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run PC580 Rail, Swarm, Ion, Bomb and profile regressions
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            ASTEROIDYiOS/GameCore.swift
            ASTEROIDYiOS/FlightDynamics556.swift
            ASTEROIDYiOS/CombatCollision556.swift
            ASTEROIDYiOS/CombatBalance556.swift
            ASTEROIDYiOS/Sphere67.swift
            ASTEROIDYiOS/SphereAsteroid556.swift
            ASTEROIDYiOS/MissionWave568.swift
            ASTEROIDYiOS/MissionIncoming568.swift
            ASTEROIDYiOS/MissionStart261.swift
            ASTEROIDYiOS/CampaignProgress556.swift
            ASTEROIDYiOS/MissionCatalog568.swift
            ASTEROIDYiOS/Sector01Entry568.swift
            ASTEROIDYiOS/Sector01PreparedWave568.swift
            ASTEROIDYiOS/CarbonisBodyContact68.swift
            ASTEROIDYiOS/SphereRockContact68.swift
            ASTEROIDYiOS/ShooterTactics71.swift
            ASTEROIDYiOS/Sector01Shop568.swift
            ASTEROIDYiOS/Sector01MissionSummary568.swift
            ASTEROIDYiOS/Sector01MissionSettlement568.swift
            ASTEROIDYiOS/CarbonisDestruction524.swift
            ASTEROIDYiOS/H55Workshop580.swift
            ASTEROIDYiOS/H55SourceMechanics580.swift
            ASTEROIDYiOS/CombatGuardianDrone298.swift
            ASTEROIDYiOS/CarbonisCombat568.swift
          )
          swiftc "${sources[@]}" Tests/H11RailSwarm580Tests.swift -o /tmp/h11-rail-swarm-pc580
          /tmp/h11-rail-swarm-pc580
          swiftc "${sources[@]}" Tests/H11Consumables580Tests.swift -o /tmp/h11-consumables-pc580
          /tmp/h11-consumables-pc580
          swiftc "${sources[@]}" Tests/Sector01MissionFinish568Tests.swift -o /tmp/h11-shop-mission-pc580
          /tmp/h11-shop-mission-pc580
          swiftc -O \
            ASTEROIDYiOS/Sector01Shop568.swift \
            ASTEROIDYiOS/H55Workshop580.swift \
            Tests/H55Workshop580Tests.swift \
            -o /tmp/h11-old-shop
          /tmp/h11-old-shop
          swiftc -frontend -parse ASTEROIDYiOS/H55WorkshopPanel580.swift
          swiftc -frontend -parse ASTEROIDYiOS/CarbonisSession568.swift
          swiftc -frontend -parse ASTEROIDYiOS/Sector01ShopPanel568.swift
          swiftc -frontend -parse ASTEROIDYiOS/Sector01Scene568.swift
      - name: Guard exact original weapons, shader kinds and migration contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          shop=Path("ASTEROIDYiOS/Sector01Shop568.swift").read_text()
          combat=Path("ASTEROIDYiOS/CarbonisCombat568.swift").read_text()
          fx=Path("ASTEROIDYiOS/CarbonisProjectileFX69.swift").read_text()
          assert "case pulse=0,twin=1,scatter=2,rail=3,swarm=4" in shop
          assert "case .rail:return railOwned ? 0 : 160" in shop
          assert "case .swarm:return swarmOwned ? 0 : 190" in shop
          assert "decodeIfPresent(Bool.self,forKey:.railOwned)" in shop
          assert "decodeIfPresent(Bool.self,forKey:.swarmOwned)" in shop
          assert "selectedWeapon == .rail ? 4" in combat
          assert "selectedWeapon == .swarm ? 3" in combat
          assert "let t=min(1,dt*4)" in combat
          assert "case 3:return RGB(r:181/255,g:123/255,b:1)" in fx
          assert "case 4:return RGB(r:88/255,g:1,b:143/255)" in fx
          print("PASS H11 source original 160/190 prices, 4/3 payloads, homing and real GPU kinds")
          PY
