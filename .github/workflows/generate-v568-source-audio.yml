name: ASTEROIDY v568 original music + SFX from source (NO IPA)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-v568-source-audio.yml'
permissions:
  contents: write
jobs:
  source-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Verify source bundles and unpack byte-exact original v568
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/audio568-original reports ASTEROIDYiOS/Assets/Audio568
          echo '26d6d3593f1ac7f9c24ee7052c480a22e7998eee1e6af914425d06d3f8d2a3a0  SourceExact568/original-audio-generator.tar.bz2' | sha256sum -c -
          echo '5888521a7dfafe69c88caa0b4a49ba3ff6d654ddf982ee37665ae7946727e66a  SourceExact568/original-audio-voice-zig-and-alarm.tar.bz2' | sha256sum -c -
          tar -xjf SourceExact568/original-audio-generator.tar.bz2 -C build/audio568-original
          tar -xjf SourceExact568/original-audio-voice-zig-and-alarm.tar.bz2 -C build/audio568-original
          cp build/audio568-original/Shared/music/SYNTH_LICENSES.txt ASTEROIDYiOS/Assets/Audio568/SYNTH_LICENSES.txt
          find build/audio568-original -type f | sort > reports/audio-source-manifest.txt
      - name: Install Mono original source runtime and FFmpeg encoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-mcs mono-runtime libmono-system-core4.0-cil ffmpeg
          mono --version | head -1
          ffmpeg -version | head -1
      - name: Compile untouched C# v568 synthesis and wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd build/audio568-original
          mcs -optimize+ -r:System.Core \
            -resource:Shared/music/zig.bin,Synth.Zig \
            -out:source-audio568.exe \
            MusicSynth.cs SynthDsp.cs SynthCoefficients.cs SynthRandom.cs \
            MusicMaster.cs CombatSound.cs Sounds79.cs IntroMusic43.cs \
            Windows/src/BossAlarm86.cs \
            ../../SourceExact568/AudioRender568Harness.cs
      - name: Source startup - 9 SFX banks, 6 enemy voices, menu tracks 0 and 1
        shell: bash
        run: |
          set -euo pipefail
          src=build/audio568-original
          dst=ASTEROIDYiOS/Assets/Audio568
          encode() {
            ffmpeg -nostdin -hide_banner -loglevel error -y -f s16le -ar 44100 -ac 2 \
              -i "$1" -c:a aac -b:a "$3" -movflags +faststart "$2"
          }
          for code in 10 11 12 13 14 20 21 22 30; do
            for variation in 0 1 2; do
              mono "$src/source-audio568.exe" sfx "$code:$variation" "$RUNNER_TEMP/track.raw"
              encode "$RUNNER_TEMP/track.raw" "$dst/SFX${code}_${variation}.m4a" 128k
            done
          done
          for code in 40 41 42 43 44 45 60; do
            mono "$src/source-audio568.exe" sfx "$code:0" "$RUNNER_TEMP/track.raw"
            encode "$RUNNER_TEMP/track.raw" "$dst/SFX${code}_0.m4a" 128k
          done
          for track in 0 1; do
            mono "$src/source-audio568.exe" music "$track" "$RUNNER_TEMP/track.raw"
            if [ "$track" = 0 ]; then
              echo "38d733889ada15837d074b9bb44a21021b8fc8b8d64a1200da08a2cd2fe6f724  $RUNNER_TEMP/track.raw" | sha256sum -c -
            fi
            encode "$RUNNER_TEMP/track.raw" "$dst/Music${track}.m4a" 192k
          done
          mono "$src/source-audio568.exe" intro 15 "$RUNNER_TEMP/track.raw"
          echo "bf8f5ff7fcdffce23761a70e03bfb3fd01dc2f51e2b8199f74fade7dd9d58b82  $RUNNER_TEMP/track.raw" | sha256sum -c -
          encode "$RUNNER_TEMP/track.raw" "$dst/Intro43.m4a" 192k
          for k in 0 1 2 3 4 6 7; do
            gzip -dc "$src/Shared/music/voice79/pickup${k}.pcm.gz" > "$RUNNER_TEMP/track.raw"
            encode "$RUNNER_TEMP/track.raw" "$dst/Voice${k}.m4a" 160k
          done
          find "$dst" -type f -printf '%f %s bytes\n' | sort > reports/original-audio-assets.txt
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$dst/Music0.m4a" > reports/music0-duration.txt
      - name: Commit source-verified startup music and 40 sound effects
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ASTEROIDYiOS/Assets/Audio568
          git diff --cached --quiet || git commit -m 'Original v568 startup: source-generated SFX, two menu songs, intro and Polish voices'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Background source synthesis - remaining thirteen original songs
        shell: bash
        run: |
          set -euo pipefail
          src=build/audio568-original
          dst=ASTEROIDYiOS/Assets/Audio568
          for track in $(seq 2 14); do
            mono "$src/source-audio568.exe" music "$track" "$RUNNER_TEMP/track.raw"
            ffmpeg -nostdin -hide_banner -loglevel error -y -f s16le \
              -ar 44100 -ac 2 -i "$RUNNER_TEMP/track.raw" \
              -c:a aac -b:a 192k -movflags +faststart "$dst/Music${track}.m4a"
            echo "READY original track $track / 14"
          done
          find "$dst" -type f -printf '%f %s bytes\n' | sort > reports/original-audio-assets.txt
      - name: Commit all 15 actual v568 source tracks to iOS assets
        shell: bash
        run: |
          set -euo pipefail
          git add ASTEROIDYiOS/Assets/Audio568
          git diff --cached --quiet || git commit -m 'Original v568 full 15-track synthesizer soundtrack (tracks 2-14)'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish exact-source audio generation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-v568-SOURCE-EXACT-AUDIO-PROVENANCE
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
