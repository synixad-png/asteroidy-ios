# One single user-requested build from the actual ASTEROIDY v556 iOS sources.
# Changes to gameplay or ordinary workflows do not retrigger this workflow.
# project.yml remains unchanged (usual iPhone+iPad support is preserved).
name: ASTEROIDY iOS - ONE-TIME iPhone ONLY unsigned IPA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iphone-only-once-20261105.yml'

permissions:
  contents: read

jobs:
  iphone-only:
    name: Build iPhone arm64 only, verify and upload unsigned IPA
    # Same verified runner as successful IPA build in iphone-ipa-test.
    # Intel host compiles an ARM64 iPhone target with Xcode's iphoneos SDK.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Record native Apple build environment
        run: |
          set -euo pipefail
          mkdir -p reports
          { sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; echo "Source commit: $GITHUB_SHA"; } | tee reports/environment.txt
      - name: Generate Xcode project from existing actual sources
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Compile ONLY iPhone for physical devices (unsigned, arm64)
        run: |
          set -euo pipefail
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$PWD/build/DerivedData" \
            build 2>&1 | tee reports/xcodebuild.log
      - name: Package and independently validate iPhone-only IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP" && test -f "$APP/Info.plist"
          echo "Packaging iPhone-only $APP" | tee reports/package.txt
          mkdir -p distribution/Payload
          cp -R "$APP" distribution/Payload/
          (cd distribution && zip -q -r -y ../ASTEROIDY_iPhone_ONLY_UNSIGNED.ipa Payload)
          python3 - <<'PY' | tee reports/iphone-only-verification.txt
          import plistlib, struct, zipfile
          name = 'ASTEROIDY_iPhone_ONLY_UNSIGNED.ipa'
          with zipfile.ZipFile(name) as z:
              assert z.testzip() is None, 'Bad IPA ZIP CRC'
              paths=z.namelist()
              plists=[p for p in paths if p.startswith('Payload/') and p.count('/')==2 and p.endswith('.app/Info.plist')]
              assert len(plists)==1, f'Expected exactly 1 app plist, found: {plists}'
              info=plistlib.loads(z.read(plists[0]))
              assert info.get('CFBundlePackageType')=='APPL'
              assert info.get('CFBundleSupportedPlatforms')==['iPhoneOS']
              assert set(info.get('UIDeviceFamily',[]))=={1}, f'iPad not excluded: {info.get("UIDeviceFamily")}'
              assert info.get('MinimumOSVersion')=='17.0', info.get('MinimumOSVersion')
              root=plists[0].rsplit('/',1)[0]
              exe=root+'/'+info['CFBundleExecutable']
              binary=z.read(exe)
              magic,cpu,subtype,kind,ncmds,size,flags,reserved=struct.unpack_from('<8I',binary)
              assert magic==0xfeedfacf and cpu==0x0100000c and kind==2, 'Not a thin arm64 iPhone executable'
              off=32
              platforms=[]
              for _ in range(ncmds):
                  cmd,length=struct.unpack_from('<II',binary,off)
                  assert length>=8 and off+length<=len(binary),'Invalid Mach-O load command'
                  if cmd==0x32:
                      platforms.append(struct.unpack_from('<I',binary,off+8)[0])
                  off+=length
              assert platforms==[2], f'Not an iOS device binary: {platforms}'
              assert not any(p.endswith('/embedded.mobileprovision') for p in paths),'Unexpected provisioning profile'
              for asset in ('Vanguard556.as3d','Boreas556.as3d','Boreas556.asmo','BoreasMorphBinding556.json','default.metallib'):
                  assert any(p.startswith(root+'/') and p.endswith('/'+asset) for p in paths), 'Missing '+asset
              print('PASS: real arm64 iPhoneOS app, UIDeviceFamily=[1] (no iPad), iOS 17.0, Metal shader, original v556 assets, IPA ZIP CRC')
              print('UNSIGNED: Sideloadly or another signing method required; no iPhone hardware was tested.')
          PY
          shasum -a 256 ASTEROIDY_iPhone_ONLY_UNSIGNED.ipa | tee reports/SHA256SUMS.txt
      - name: Upload actual unsigned iPhone-only IPA
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-iPhone-ONLY-unsigned-IPA
          path: |
            ASTEROIDY_iPhone_ONLY_UNSIGNED.ipa
            reports/environment.txt
            reports/package.txt
            reports/iphone-only-verification.txt
            reports/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish compilation diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-iPhone-ONLY-build-diagnostics
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
