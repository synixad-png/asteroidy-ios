# ASTEROIDY iOS v556/v21: physical iPhone + iPad, ONLY on manual request.
# The user asked to restore iPad support after the temporary iPhone-only IPA.
# Do not run automatically during normal gameplay implementation.
name: ASTEROIDY iOS - iPhone + iPad IPA (manual)
on:
  workflow_dispatch:
    inputs:
      compatibility_old_ship:
        description: "Tylko stary Vanguard AS3D — świadomie pomiń oryginalną teksturę"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  device-universal:
    name: Compile iPhone + iPad arm64 and validate unsigned IPA
    # macos-15-intel produced a real verified iPhone IPA in run 42090319849.
    # The runner's CPU is Intel; Xcode targets arm64 physical iOS devices.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify iPhone and iPad are enabled in the source project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY' | tee reports/device-families.txt
          from pathlib import Path
          project = Path('project.yml').read_text()
          assert "TARGETED_DEVICE_FAMILY: '1,2'" in project, 'Expected both iPhone and iPad'
          assert 'INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone' in project
          assert 'INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad' in project
          print('PASS: native project declares iPhone + iPad (UIDeviceFamily 1,2)')
          PY
          python3 Tools/verify_ios_inputs.py | tee reports/source-assets.txt
      - name: Import compact source-verified Vanguard431 asset bundle when supplied
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/prepare_vanguard431_assets.py | tee reports/vanguard-asset-import.txt
      - name: Require original Vanguard 4311 UV + BaseColor for NEW textured release
        shell: bash
        env:
          COMPAT_OLD_SHIP: ${{ inputs.compatibility_old_ship }}
        run: |
          set -euo pipefail
          if [ "$COMPAT_OLD_SHIP" = "true" ]; then
            echo "WARNING: explicitly requested v556 AS3D compatibility release; original Vanguard texture NOT bundled" | tee reports/vanguard-material.txt
          else
            python3 Tools/verify_original_vanguard_resources.py --assets ASTEROIDYiOS/Assets | tee reports/vanguard-material.txt
          fi
      - name: Honor explicitly selected old AS3D compatibility mode
        if: inputs.compatibility_old_ship == true
        shell: bash
        run: |
          set -euo pipefail
          # Only mutate the temporary GitHub Actions checkout, NEVER
          # remove the verified original source files from GitHub.
          # Otherwise, the renderer would still select the real source
          # texture despite the user's explicit legacy toggle.
          rm -f ASTEROIDYiOS/Assets/Vanguard431Source.mesh
          rm -f ASTEROIDYiOS/Assets/Vanguard431Base.jpg
          test ! -e ASTEROIDYiOS/Assets/Vanguard431Source.mesh
          test ! -e ASTEROIDYiOS/Assets/Vanguard431Base.jpg
          echo "PASS: explicit old-AS3D compatibility mode really omits both source assets" | tee -a reports/vanguard-material.txt
      - name: Record native Apple compiler and source revision
        shell: bash
        run: |
          set -euo pipefail
          { sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; echo "Commit: $GITHUB_SHA"; } | tee reports/environment.txt
      - name: Generate original iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Compile universal iPhone and iPad device target (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO 'TARGETED_DEVICE_FAMILY=1,2' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$PWD/build/DerivedData" \
            build 2>&1 | tee reports/xcodebuild.log
      - name: Package and verify actual unsigned dual-device IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP" && test -f "$APP/Info.plist"
          mkdir -p distribution/Payload
          cp -R "$APP" distribution/Payload/
          (cd distribution && zip -q -r -y ../ASTEROIDY_iPhone_iPad_UNSIGNED.ipa Payload)
          if [ "${{ inputs.compatibility_old_ship }}" = "true" ]; then
            python3 Tools/verify_ipa.py ASTEROIDY_iPhone_iPad_UNSIGNED.ipa | tee reports/verification.txt
          else
            python3 Tools/verify_ipa.py ASTEROIDY_iPhone_iPad_UNSIGNED.ipa --require-vanguard-original | tee reports/verification.txt
          fi
          shasum -a 256 ASTEROIDY_iPhone_iPad_UNSIGNED.ipa | tee reports/SHA256SUMS.txt
      - name: Upload real unsigned iPhone + iPad IPA
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-iPhone-iPad-unsigned-IPA
          path: |
            ASTEROIDY_iPhone_iPad_UNSIGNED.ipa
            reports/device-families.txt
            reports/source-assets.txt
            reports/vanguard-material.txt
            reports/vanguard-asset-import.txt
            reports/environment.txt
            reports/verification.txt
            reports/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish build diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-iPhone-iPad-build-diagnostics
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
