name: H12 PC580 original H51 machinery source and iOS scene integration
on:
  push:
    branches: [feature/ios-h55-v580-native-entry]
    paths:
      - 'ASTEROIDYiOS/H55H12Timeline580.swift'
      - 'ASTEROIDYiOS/H55H12Tracks580.swift'
      - 'ASTEROIDYiOS/H55H12SceneAnimator580.swift'
      - 'ASTEROIDYiOS/H55ScenePage580.swift'
      - 'Tests/H55H12Timeline580Tests.swift'
      - 'Tests/H55H12Tracks580Tests.swift'
      - '.github/workflows/h12-machinery-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test original PC580 H51 composite source time and H07/H09 guards
        shell: bash
        run: |
          set -euo pipefail
          swiftc -Onone ASTEROIDYiOS/H55H12Timeline580.swift \
            Tests/H55H12Timeline580Tests.swift \
            -o /tmp/h12-original-pc580
          /tmp/h12-original-pc580
          swiftc -Onone ASTEROIDYiOS/H55H12Timeline580.swift \
            ASTEROIDYiOS/H55H12Tracks580.swift \
            Tests/H55H12Tracks580Tests.swift \
            -o /tmp/h12-glb2-source
          /tmp/h12-glb2-source
          swiftc -frontend -parse ASTEROIDYiOS/H55H12Tracks580.swift
          swiftc -frontend -parse ASTEROIDYiOS/H55H12SceneAnimator580.swift
          swiftc -frontend -parse ASTEROIDYiOS/H55ScenePage580.swift
          python3 - <<'PY'
          from pathlib import Path
          scene=Path('ASTEROIDYiOS/H55ScenePage580.swift').read_text()
          anim=Path('ASTEROIDYiOS/H55H12SceneAnimator580.swift').read_text()
          tracks=Path('ASTEROIDYiOS/H55H12Tracks580.swift').read_text()
          assert 'let h12=try? H55H12Tracks580.load(' in scene
          assert '!H55H12FeatureFlags580.autonomousDronesEnabled' in scene
          assert 'excludeImportedDroneRoots:' in scene
          assert 'func sample(_ t:Float,into output:inout [Float])' in tracks
          assert 'binding.track.sample(sample.at,into:&frameValues)' in anim
          assert 'source.contains("drone") || source.contains("dron")' in tracks
          assert 'machinery=nil' in scene and 'h12Status="H12: BRAK ZGODNYCH' in scene
          assert 'machinery?.advance(dt:dt)' in scene
          assert scene.index('machinery?.advance(dt:dt)')<scene.index('updateAirlocks(dt:dt)')
          assert 'protectedNpcRoot:importedNpc' in scene
          assert 'excludedAirlockNames:Set(H55AirlockController580.leafNames.flatMap{$0})' in scene
          assert 'machinery?.apply(time:0)' in scene
          assert 'if machinery != nil {return}' in scene
          assert 'node.simdPosition=' in anim
          assert 'node.simdOrientation=' in anim
          assert 'node.simdScale=' in anim
          assert 'SCNMorpher' not in anim or 'morpher.setWeight' in anim
          assert 'word(header,0)==0x46546c67' in tracks
          assert 'sourceDurations:[String:Float]' in tracks
          assert 'ANIMATION_LOOP' in tracks
          print("PASS H12 source-only: one real GLB, H51 timeline, SceneKit TRS, native H07 doors/H09 NPC protected; hardware/real GLB check remains")
          PY
