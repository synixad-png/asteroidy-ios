name: ASTEROIDY iOS - PC586 original pickup catalog
on:
  push:
    branches: [feature/ios-h55-v580-native-entry]
    paths:
      - 'ASTEROIDYiOS/SourcePickupModels586.swift'
      - 'Tests/SourcePickupModels586Tests.swift'
      - 'Tests/SourcePickupVisual586Tests.swift'
      - 'Tests/PC586IntegrationContract.py'
      - 'ASTEROIDYiOS/SourcePickupVisual586.swift'
      - 'ASTEROIDYiOS/SourcePickupMetal586.swift'
      - 'ASTEROIDYiOS/SourceCombatSupply586.swift'
      - 'ASTEROIDYiOS/SourcePickupAbilities586.swift'
      - 'ASTEROIDYiOS/Sphere67.swift'
      - 'ASTEROIDYiOS/CarbonisSession568.swift'
      - 'ASTEROIDYiOS/Sector01Scene568.swift'
      - 'ASTEROIDYiOS/CarbonisCombat568.swift'
      - 'ASTEROIDYiOS/Sector01CarbonisPreview568.swift'
      - 'ASTEROIDYiOS/Sector01Carbonis568.metal'
      - 'ASTEROIDYiOS/CarbonisVisualSettingsPanel568.swift'
      - 'Tools/prepare_pc586_runtime_resources.py'
      - 'Tools/pack_pc586_unsigned_ipa.py'
      - 'Tools/pack_pc586_complete_test_ipa.py'
      - 'Tools/verify_pc586_complete_ipa.py'
      - '.github/workflows/verify-pc586-pickup-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-model-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute original PC586 model registry tests
        run: |
          set -euo pipefail
          swiftc ASTEROIDYiOS/SourcePickupModels586.swift Tests/SourcePickupModels586Tests.swift -o /tmp/pc586-original-models
          /tmp/pc586-original-models
      - name: Verify six native item visual defaults and persistence
        run: |
          set -euo pipefail
          swiftc ASTEROIDYiOS/SourcePickupModels586.swift ASTEROIDYiOS/SourcePickupVisual586.swift Tests/SourcePickupVisual586Tests.swift -o /tmp/pc586-original-visual-settings
          /tmp/pc586-original-visual-settings
      - name: Enforce true gameplay to GPU to IPA integration contract
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/prepare_pc586_runtime_resources.py Tools/pack_pc586_unsigned_ipa.py Tools/pack_pc586_complete_test_ipa.py Tools/verify_pc586_complete_ipa.py
          python3 Tests/PC586IntegrationContract.py
