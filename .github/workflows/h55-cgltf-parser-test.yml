name: H55 temporary cgltf parser diagnostic artifact
on:
  push:
    branches:
      - feature/ios-h55-v580-native-entry
    paths:
      - '.github/workflows/h55-cgltf-parser-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  make-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve exact GLTFKit2 0.5.15 cgltf parser header
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://raw.githubusercontent.com/warrenm/GLTFKit2/0.5.15/GLTFKit2/deps/cgltf/cgltf.h' -o cgltf_0_5_15.h
          test "$(wc -c <cgltf_0_5_15.h)" -gt 200000
          grep -q 'cgltf_parse_file' cgltf_0_5_15.h
      - uses: actions/upload-artifact@v4
        with:
          name: H55-CGLTF-parser-diagnostic-source
          path: cgltf_0_5_15.h
          retention-days: 1
          if-no-files-found: error
