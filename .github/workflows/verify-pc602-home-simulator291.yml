# Runs a REAL installed iOS app in Apple Simulator, unlike the Swift/Metal
# compile-only gate. One branch-scoped run avoids a new Actions job backlog.
name: PC602 H290 / PC609 three ships - real iPad Simulator regression (NO IPA)

on:
  workflow_dispatch:

concurrency:
  group: pc609-real-ipad-smoke-${{ github.ref }}
  # Preserve an actively running physical simulator test; do not cancel it
  # solely because a later revision was committed.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  genuine-orbit-ui:
    name: Real iPad simulator - PC609 model selection, H290 and real CARBONIS01 scene
    # Apple Silicon simulator runner avoids the CoreSimulator 60s timeout
    # observed on saturated macos-15-intel before XCUITest even launched.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify and stage original graphics / actual PC602 world
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 Tools/stage_pc602_planetarium.py
          python3 Tools/prepare_vanguard431_assets.py
          python3 Tools/prepare_v568_player_ship_ios.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tests/HudPlanetariumIntegration600Contract.py
          python3 Tools/prepare_v568_w3_original_assets.py --root . --destination ASTEROIDYiOS/Assets --required
          python3 Tools/prepare_v568_w3_home_planet290.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/prepare_v568_carbonis_sector01.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/stage_pc602_newhome290.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/stage_pc602_orbit_belt51.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/export_boreas_node_tracks556.py --root . --destination ASTEROIDYiOS/Assets/Boreas556.asnt
          python3 Tools/materialize_pc586_original_resources.py
          python3 Tools/verify_embedded_pc609_assets.py --assets ASTEROIDYiOS/Assets --boreas
          python3 Tests/PC602HomeWorldUI291Contract.py
      - name: Decode the original bundled PC609 KESTREL and BASTION with native Swift
        shell: bash
        run: |
          set -euo pipefail
          swiftc -Onone ASTEROIDYiOS/SourcePC609Zlib.swift ASTEROIDYiOS/SourceVanguardMesh431.swift ASTEROIDYiOS/SourceKestrel603.swift ASTEROIDYiOS/SourceBastion606.swift Tests/OriginalPC609PackDecoderTests.swift -o /tmp/pc609-simulator-preflight
          /tmp/pc609-simulator-preflight > diagnostics/original-pc609-runtime-decode.txt 2>&1 || {
            cat diagnostics/original-pc609-runtime-decode.txt
            exit 1
          }
          cat diagnostics/original-pc609-runtime-decode.txt
      - name: Generate original native app / XCTest targets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
          python3 - <<'PY'
          import sys, subprocess
          sys.path.insert(0, 'Tools')
          from run_original_ios_simulator_capture import available_devices
          # CoreSimulator service can take time to start on a fresh runner;
          # do not misreport startup infrastructure as an editor failure.
          for attempt in range(2):
              try:
                  subprocess.run(["xcrun","simctl","list","-j","devices","available"],
                                 check=True,capture_output=True,timeout=120)
                  break
              except (subprocess.SubprocessError,TimeoutError) as error:
                  print("CoreSimulator warmup",attempt+1,str(error))
          _, name, udid, state = available_devices(('IPAD',))['IPAD']
          with open('diagnostics/device-udid.txt', 'w') as f:
              f.write(udid+'\n')
          print('Real Apple Simulator:', name, udid, state)
          PY
      - name: Launch actual app, enter H290, capture real framebuffer, exercise HUD and return
        shell: bash
        timeout-minutes: 29
        run: |
          set -euo pipefail
          UDID=$(cat diagnostics/device-udid.txt)
          # Avoid counting a cold CoreSimulator boot as an audio-start delay.
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -parallel-testing-enabled NO \
            -only-testing:ASTEROIDYW3UITests/PC609RuntimeUITests \
            -derivedDataPath "$PWD/build/PC602OrbitSimulator" \
            -resultBundlePath "$PWD/diagnostics/PC602-H290-Real-UI.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > diagnostics/xcodebuild-simulator.log 2>&1 || {
              # A real device-frame capture is best-effort and must never
              # mask the first failure or block the workflow indefinitely.
              python3 - <<'PY'
          import subprocess
          from pathlib import Path
          udid=Path("diagnostics/device-udid.txt").read_text().strip()
          try:
              p=subprocess.run(["xcrun","simctl","io",udid,"screenshot",
                  "diagnostics/simulator-failure-state.png"],
                  capture_output=True,text=True,timeout=15)
              print("SIMULATOR_FRAME_CAPTURE",p.returncode,p.stderr[-500:])
          except subprocess.TimeoutExpired:
              print("SIMULATOR_FRAME_CAPTURE_TIMEOUT (original XCUITest error preserved)")
          PY
              grep -n -A 8 -B 4 -E 'error:|failed|FAILED|Timed out' diagnostics/xcodebuild-simulator.log | tail -n 110 || true
              tail -n 85 diagnostics/xcodebuild-simulator.log
              exit 1
            }
          grep -E 'Executed [0-9]+ tests|Test Suite .* passed|\*\* TEST SUCCEEDED' \
            diagnostics/xcodebuild-simulator.log | tail -n 12 \
            | tee diagnostics/ui-smoke-summary.txt
          test ! -e ASTEROIDY_iOS_UNSIGNED.ipa
      - name: Preserve ONLY authentic XCTest screenshots, logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PC609-Real-iPad-ThreeShips-Home-Carbonis-XCTest-NO-IPA
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
