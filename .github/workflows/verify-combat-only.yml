name: ASTEROIDY iOS - Swift combat tests ONLY (no IPA)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-combat-only.yml'
      - 'ASTEROIDYiOS/CombatVerifiedEncounter556.swift'
      - 'ASTEROIDYiOS/CombatRescue65.swift'
      - 'Tests/CombatVerifiedEncounter556Tests.swift'
      - 'ASTEROIDYiOS/PlanetDamageLab556.swift'
      - 'Tests/PlanetDamageLab556Tests.swift'
      - 'ASTEROIDYiOS/App.swift'
      - 'ASTEROIDYiOS/MetalRenderer.swift'
      - 'ASTEROIDYiOS/SphereRockContact68.swift'
      - 'ASTEROIDYiOS/SphereSector556.swift'
      - 'ASTEROIDYiOS/CombatSolids68.swift'
      - 'ASTEROIDYiOS/CombatHazards68.swift'
      - 'ASTEROIDYiOS/CombatCollision556.swift'
      - 'Tests/SphereRockContact68Tests.swift'
      - 'Tests/SphereShipRigidContact556Tests.swift'
      - 'Tests/CombatSolids68Tests.swift'
      - 'Tests/CombatHazards68Tests.swift'
      - 'Tests/CombatDamageShared556Tests.swift'

jobs:
  verify-combat-no-ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift compiler
        run: swift --version
      - name: Compile and run source-verified Gameplay65 rescue and Physics68 regressions
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/SphereSector556.swift ASTEROIDYiOS/CombatSolids68.swift ASTEROIDYiOS/CombatPickupPhysics68.swift ASTEROIDYiOS/CombatSurvival96.swift ASTEROIDYiOS/CombatContactRouter96.swift ASTEROIDYiOS/CombatEncounter68.swift ASTEROIDYiOS/CombatTarcza145.swift ASTEROIDYiOS/CombatRescue65.swift ASTEROIDYiOS/CombatTalentVitals78.swift ASTEROIDYiOS/CombatGuardian37.swift ASTEROIDYiOS/CombatVerifiedHit556.swift ASTEROIDYiOS/CombatRespawn556.swift ASTEROIDYiOS/CombatVerifiedEncounter556.swift Tests/CombatVerifiedEncounter556Tests.swift -o /tmp/verified-encounter-556
          /tmp/verified-encounter-556
      - name: Verify direct Gameplay65 rescue state machine
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/CombatSolids68.swift ASTEROIDYiOS/CombatSurvival96.swift ASTEROIDYiOS/CombatRescue65.swift Tests/CombatRescue65Tests.swift -o /tmp/rescue-65
          /tmp/rescue-65
      - name: Verify playable Boreas armor, hull and held Tarcza145
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/SphereSector556.swift ASTEROIDYiOS/CombatSolids68.swift ASTEROIDYiOS/CombatSurvival96.swift ASTEROIDYiOS/CombatTarcza145.swift ASTEROIDYiOS/CombatRescue65.swift ASTEROIDYiOS/CombatContactRouter96.swift ASTEROIDYiOS/CombatTalentVitals78.swift ASTEROIDYiOS/CombatGuardian37.swift ASTEROIDYiOS/CombatVerifiedHit556.swift ASTEROIDYiOS/CombatRespawn556.swift ASTEROIDYiOS/PlanetDamageLab556.swift Tests/PlanetDamageLab556Tests.swift -o /tmp/boreas-damage-lab556
          /tmp/boreas-damage-lab556
      - name: Syntax-parse active SwiftUI and Metal renderer (NO iOS build or IPA)
        run: |
          swiftc -frontend -parse ASTEROIDYiOS/App.swift
          swiftc -frontend -parse ASTEROIDYiOS/MetalRenderer.swift
      - name: Full Physics68 and Damage556 regression matrix (NO IPA)
        run: |
          set -eu
          sources="ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/SphereSector556.swift ASTEROIDYiOS/CombatSolids68.swift ASTEROIDYiOS/CombatPickupPhysics68.swift ASTEROIDYiOS/CombatSurvival96.swift ASTEROIDYiOS/CombatContactRouter96.swift ASTEROIDYiOS/CombatEncounter68.swift ASTEROIDYiOS/CombatTarcza145.swift ASTEROIDYiOS/CombatRescue65.swift ASTEROIDYiOS/CombatTalentVitals78.swift ASTEROIDYiOS/CombatGuardian37.swift ASTEROIDYiOS/CombatVerifiedHit556.swift ASTEROIDYiOS/CombatRespawn556.swift ASTEROIDYiOS/CombatVerifiedEncounter556.swift ASTEROIDYiOS/CombatHazards68.swift ASTEROIDYiOS/CombatFlatShield556.swift ASTEROIDYiOS/PlanetDamageLab556.swift"
          for test in \
            SphereRockContact68Tests \
            SphereShipRigidContact556Tests \
            CombatSolids68Tests \
            CombatCoop68Tests \
            CombatEncounter68Tests \
            CombatHazards68Tests \
            CombatDamageShared556Tests \
            CombatCollision556Tests \
            CombatRespawn556Tests \
            CombatSurvival96Tests \
            CombatTalentVitals78Tests \
            CombatGuardian37Tests \
            CombatTarcza145Tests \
            CombatFlatShield556Tests \
            CombatContactRouter96Tests \
            CombatVerifiedHit556Tests \
            CombatPickupPhysics68Tests; do
            echo "Verifying $test"
            swiftc $sources "Tests/$test.swift" -o /tmp/source-physics68-test
            /tmp/source-physics68-test
          done

  compile-ios-no-ipa:
    name: Compile iOS source only (NO IPA / NO artifact)
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode compiler
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native Xcode project from verified project.yml
        run: xcodegen generate
      - name: Typecheck and compile all native iOS Swift/Metal sources (unsigned, NO IPA)
        run: |
          set -euo pipefail
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath /tmp/asteroidy-ios-verify-only build \
            2>&1 | tee /tmp/asteroidy-ios-compile-only.log
          test -f '/tmp/asteroidy-ios-verify-only/Build/Products/Debug-iphoneos/ASTEROIDY iOS.app/Info.plist'
          echo "PASS: native iOS project compiles; no package, IPA, or artifact created."
