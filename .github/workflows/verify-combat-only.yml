          set -euo pipefail
          python3 Tests/CombatOriginalSkyWreck214Contract.py
          swiftc ASTEROIDYiOS/ResearchWreckGeometry214.swift Tests/ResearchWreckGeometry214Tests.swift -o /tmp/wreck211-mesh
          /tmp/wreck211-mesh
      - name: Verify source-exact Explosion524 static GPU geometry and precomputed GPU constants
