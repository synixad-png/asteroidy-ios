jobs:
  publish-combat-verify-run:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Expose run for source fighter regression review
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const path='Reports/LAST_COMBAT_VERIFY_RUN.md';
            const body='# ASTEROIDY CARBONIS source combat CI\n\nRun ID: '+context.runId+
              '\nCommit: '+context.sha+'\nActions: https://github.com/'+owner+
              '/'+repo+'/actions/runs/'+context.runId+'\n';
            let sha;
            try {
              sha=(await github.rest.repos.getContent({owner,repo,path})).data.sha;
            } catch (error) {
              if (error.status!==404) core.warning(String(error));
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,sha,branch:'main',
              message:'Expose source fighter geometry CI run',
              content:Buffer.from(body).toString('base64')
            });
  verify-combat-no-ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify authentic pre-mission Intro41 route and source Carbonis globe
