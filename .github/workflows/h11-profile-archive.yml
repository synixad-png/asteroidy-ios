name: H11 PC580 full profile archive restore and W3 regression
on:
  push:
    branches: [feature/ios-h55-v580-native-entry]
    paths:
      - 'ASTEROIDYiOS/SourceNewGame568.swift'
      - 'ASTEROIDYiOS/Sector01Shop568.swift'
      - 'ASTEROIDYiOS/H55Workshop580.swift'
      - 'ASTEROIDYiOS/H55SourceMechanics580.swift'
      - 'ASTEROIDYiOS/W3MainMenu568.swift'
      - 'ASTEROIDYiOS/App.swift'
      - 'Tests/SourceNewGame568Tests.swift'
      - 'Tests/V568W3NativeMenuContract.py'
      - '.github/workflows/h11-profile-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-profile:
    name: Actual H11 wallet ships modules talents vitals and trophy archive roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute complete W3 archive/new campaign/rollback
        shell: bash
        run: |
          set -euo pipefail
          swiftc -O \
            ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/CampaignProgress556.swift \
            ASTEROIDYiOS/Sector01Shop568.swift \
            ASTEROIDYiOS/H55Workshop580.swift \
            ASTEROIDYiOS/H55SourceMechanics580.swift \
            ASTEROIDYiOS/SourceNewGame568.swift \
            Tests/SourceNewGame568Tests.swift \
            -o /tmp/h11-profile-archive
          /tmp/h11-profile-archive
          python3 Tests/SourceNewGame568Contract.py
          python3 Tests/V568W3NativeMenuContract.py
          swiftc -frontend -parse ASTEROIDYiOS/W3MainMenu568.swift
          swiftc -frontend -parse ASTEROIDYiOS/App.swift
