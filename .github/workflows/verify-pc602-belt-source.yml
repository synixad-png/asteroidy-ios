name: PC602 original 820 asteroid belt - source generator verification

on:
  push:
    branches: [feature/ios-pc602-newhome-world-source]
    paths:
      - .github/workflows/verify-pc602-belt-source.yml
      - Tools/PC602OrbitBelt51.cs
      - Tools/stage_pc602_orbit_belt51.py
      - Tests/PC602OrbitBelt51Tests.py
      - Tools/stage_pc602_newhome290.py
  pull_request:
    paths:
      - .github/workflows/verify-pc602-belt-source.yml
      - Tools/PC602OrbitBelt51.cs
      - Tools/stage_pc602_orbit_belt51.py
      - Tests/PC602OrbitBelt51Tests.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pc602-belt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify original H290 from 4 source-hashed GitHub ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/stage_pc602_newhome290.py --root . --destination ASTEROIDYiOS/Assets
      - name: Build all 820 original asteroids with the actual C# Random
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/stage_pc602_orbit_belt51.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tests/PC602OrbitBelt51Tests.py --root . --asset ASTEROIDYiOS/Assets/PC602OrbitBelt51.bin
          sha256sum ASTEROIDYiOS/Assets/PC602OrbitBelt51.bin
      - name: Audit no synthetic asteroid fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/PC602HomeScene291Contract.py
          test -f ASTEROIDYiOS/PC602OrbitBelt51.swift
          test -f ASTEROIDYiOS/PC602OrbitBelt51.metal
          echo "PASS: PC602 source 820 asteroids; NO fabricated GLB, alternative mesh, full ZIP copy, or GPU claim"
