name: ASTEROIDY iOS - Source orbit camera tests (NO IPA)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-metal-camera.yml'
      - 'ASTEROIDYiOS/Sphere67.swift'
      - 'ASTEROIDYiOS/MetalRenderer.swift'
      - 'ASTEROIDYiOS/App.swift'
      - 'ASTEROIDYiOS/IntroOrbit41.swift'
      - 'ASTEROIDYiOS/SourceFighterToon60.swift'
      - 'ASTEROIDYiOS/SourceVanguardMesh431.swift'
      - 'Tests/SourceVanguardMesh431Tests.swift'
      - 'Tests/SourceVanguardTextureContract431.py'
      - 'Tools/verify_original_vanguard_resources.py'
      - 'Tests/ReleaseGateVanguard431Tests.py'
      - 'Tools/prepare_vanguard431_assets.py'
      - 'Tests/PrepareVanguardPackTests.py'
      - 'Tools/verify_ipa.py'
      - '.github/workflows/build-ios-iphone-ipad-manual.yml'
      - 'Tests/SourceFighterToon60Tests.swift'
      - 'Tests/SourceFighterToonContract60.py'
      - 'ASTEROIDYiOS/IntroEnginePlasma491.swift'
      - 'Tests/IntroEnginePlasma491Tests.swift'
      - 'Tests/IntroEnginePlasmaSourceContract491.py'
      - 'ASTEROIDYiOS/IntroVanguard431.swift'
      - 'Tests/IntroVanguard431Tests.swift'
      - 'Tests/IntroVanguardSourceContract431.py'
      - 'ASTEROIDYiOS/IntroAtmosphere47.swift'
      - 'Tests/IntroAtmosphere47Tests.swift'
      - 'Tests/IntroAtmosphereSourceContract47.py'
      - 'ASTEROIDYiOS/IntroRockGeometry41.swift'
      - 'Tests/IntroOrbit41Tests.swift'
      - 'Tests/IntroRockGeometry41Tests.swift'
      - 'Tests/IntroOrbitSourceContract41.py'
      - 'Tests/IntroBoreasMorphSourceContract556.py'
      - 'ASTEROIDYiOS/Ship.metal'
      - 'Tests/SphereCameraView556Tests.swift'
      - 'Tests/SphereProjectionSourceContract556.py'
      - 'Tests/SkyPointSourceContract556.py'
      - 'Tests/SphereSolarOverlay556Tests.swift'
      - 'Tests/SolarOverlaySourceContract556.py'
      - 'Tests/SphereNebula556Tests.swift'
      - 'Tests/NebulaSourceContract556.py'
      - 'ASTEROIDYiOS/BlackHoleSky55.swift'
      - 'Tests/BlackHoleSky55Tests.swift'
      - 'Tests/BlackHoleSourceContract556.py'
      - 'ASTEROIDYiOS/DeepSkyPlanets55.swift'
      - 'Tests/DeepSkyPlanets55Tests.swift'
      - 'Tests/DeepSkyPlanetsSourceContract556.py'
      - 'ASTEROIDYiOS/SkyTextureGate55.swift'
      - 'Tests/SkyTextureGate55Tests.swift'
      - 'Tests/SkyTextureGateSourceContract55.py'


# Keep only the latest Metal source-check revision in the runner queue.
# Does not trigger, archive, sign, or upload any IPA.
concurrency:
  group: asteroidy-ios-metal-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-camera-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Original C# v556 camera orbit and right/up/forward projection
        run: |
          set -eu
          swiftc ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            Tests/SphereCameraView556Tests.swift \
            -o /tmp/sphere-camera-556
          /tmp/sphere-camera-556
          swiftc ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            Tests/SphereSolarOverlay556Tests.swift \
            -o /tmp/sphere-solar-overlay-556
          /tmp/sphere-solar-overlay-556
          swiftc ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            Tests/SphereNebula556Tests.swift \
            -o /tmp/sphere-nebula-556
          /tmp/sphere-nebula-556
          swiftc ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/BlackHoleSky55.swift \
            Tests/BlackHoleSky55Tests.swift \
            -o /tmp/black-hole-55
          /tmp/black-hole-55
          swiftc ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/DeepSkyPlanets55.swift \
            Tests/DeepSkyPlanets55Tests.swift \
            -o /tmp/deep-planets-55
          /tmp/deep-planets-55
          swiftc ASTEROIDYiOS/SkyTextureGate55.swift \
            Tests/SkyTextureGate55Tests.swift \
            -o /tmp/sky-texture-gate55
          /tmp/sky-texture-gate55
      - name: Verify original v556 .4/1600 spherical camera clip planes in Metal
        run: python3 Tests/SphereProjectionSourceContract556.py
      - name: Original IntroScene41 camera, Vanguard axes and 820 seeded orbital stones
        run: |
          set -eu
          swiftc ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/IntroOrbit41.swift \
            Tests/IntroOrbit41Tests.swift \
            -o /tmp/intro-orbit-source41
          /tmp/intro-orbit-source41
          python3 Tests/IntroOrbitSourceContract41.py
          python3 Tests/IntroBoreasMorphSourceContract556.py
      - name: Verify authentic PC v4311 Vanguard cinematic size and center from baked GPU resource
        run: |
          set -eu
          swiftc ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/IntroOrbit41.swift \
            ASTEROIDYiOS/IntroVanguard431.swift \
            Tests/IntroVanguard431Tests.swift \
            -o /tmp/intro-vanguard-431
          /tmp/intro-vanguard-431
          python3 Tests/IntroVanguardSourceContract431.py
      - name: Reject silent AS3D fallback in future textured Vanguard IPA
        run: |
          set -eu
          python3 Tests/ReleaseGateVanguard431Tests.py
          python3 Tests/PrepareVanguardPackTests.py
      - name: Source Vanguard v4311 exact UV stream parser and optional original JPEG material
        run: |
          set -eu
          swiftc ASTEROIDYiOS/SourceVanguardMesh431.swift \
            Tests/SourceVanguardMesh431Tests.swift \
            -o /tmp/source-vanguard-uv431
          /tmp/source-vanguard-uv431
          python3 Tests/SourceVanguardTextureContract431.py
      - name: Original GpuToon60 three-band source lighting on Vanguard (CPU math and Metal contract)
        run: |
          set -eu
          swiftc ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/SourceFighterToon60.swift \
            Tests/SourceFighterToon60Tests.swift \
            -o /tmp/fighter-toon60
          /tmp/fighter-toon60
          python3 Tests/SourceFighterToonContract60.py
      - name: Original GpuShip v491 additive two-engine plasma (CPU golden tests + GPU source contract)
        run: |
          set -eu
          swiftc ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/IntroEnginePlasma491.swift \
            Tests/IntroEnginePlasma491Tests.swift \
            -o /tmp/intro-plasma491
          /tmp/intro-plasma491
          python3 Tests/IntroEnginePlasmaSourceContract491.py
      - name: Original GpuIntro41 seed-specific cratered rock geometry and normals
        run: |
          set -eu
          swiftc ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/AssetMesh.swift \
            ASTEROIDYiOS/IntroOrbit41.swift \
            ASTEROIDYiOS/IntroRockGeometry41.swift \
            Tests/IntroRockGeometry41Tests.swift \
            -o /tmp/intro-rock-source41
          /tmp/intro-rock-source41
      - name: Original 3D Boreas atmosphere 24x96 cap and camera-facing source basis
        run: |
          set -eu
          swiftc ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/AssetMesh.swift \
            ASTEROIDYiOS/IntroAtmosphere47.swift \
            Tests/IntroAtmosphere47Tests.swift \
            -o /tmp/intro-atmosphere47
          /tmp/intro-atmosphere47
          python3 Tests/IntroAtmosphereSourceContract47.py
      - name: Verify original RGBA sky point sprites and pipeline contract (static)
        run: python3 Tests/SkyPointSourceContract556.py
      - name: Original GpuIntro41 + GpuCosmos39 source solar ray and GPU contract
        run: python3 Tests/SolarOverlaySourceContract556.py
      - name: Original GpuCosmos39 nebula texture and 36-layer Metal contract
        run: python3 Tests/NebulaSourceContract556.py
      - name: BlackHole55 source GPU blend and 3-layer render contract
        run: python3 Tests/BlackHoleSourceContract556.py
      - name: Verify three source BuildDeepPlanet55 bodies and Metal painter order
        run: python3 Tests/DeepSkyPlanetsSourceContract556.py
      - name: Confirm lazy visible-only source PArgb sky GPU allocations
        run: python3 Tests/SkyTextureGateSourceContract55.py
      - name: Parse Metal renderer Swift sources (not an Xcode compile)
        run: |
          swiftc -frontend -parse ASTEROIDYiOS/MetalRenderer.swift
          swiftc -frontend -parse ASTEROIDYiOS/App.swift

  apple-metal-source-compile:
    # Push commits continuously during the port. Previously, branch
    # concurrency cancelled the queued Apple job on every source change.
    # Keep automatic Linux checks; request Apple compile explicitly
    # through workflow_dispatch or the independent one-shot check.
    if: github.event_name == 'workflow_dispatch'
    name: Xcode Metal/Swift compile verification ONLY (NO IPA)
    # This job only checks whether genuine Apple Metal and iOS Swift
    # compilers accept the current sources. It never archives, exports,
    # uploads or signs an app for installation.
    # Proven available in successful device IPA build 42090319849;
    # still compiles original arm64 iPhoneOS + Metal, but NEVER creates IPA.
    runs-on: macos-15-intel
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Record Apple tools and SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --find metal
      - name: Generate native iOS app project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile complete iPhoneOS sources and real Metal shaders (NO IPA)
        run: |
          set -euo pipefail
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath /tmp/asteroidy-ios-metal-check \
            build 2>&1 | tee /tmp/asteroidy-ios-metal-check.log
          test -f '/tmp/asteroidy-ios-metal-check/Build/Products/Debug-iphoneos/ASTEROIDY iOS.app/Info.plist'
          test -f '/tmp/asteroidy-ios-metal-check/Build/Products/Debug-iphoneos/ASTEROIDY iOS.app/default.metallib'
          echo "PASS: Apple Swift and Metal shader compile; no IPA packaged"
