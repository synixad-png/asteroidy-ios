# Reproducibility build on MAIN: exact source of user-approved BASTION PC609 IPA.
# This workflow changes no gameplay files. It builds unsigned iPhone/iPad Release IPA,
# packages verified original assets, and publishes independent release checks.
# It intentionally does not gate native compilation on legacy standalone test harnesses.
name: ASTEROIDY MAIN — BASTION PC609 reproducible Release IPA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-main-bastion-release-proof.yml'
      - 'ASTEROIDYiOS/Assets/BASTION_PC609.bastion'
      - 'Tools/verify_bastion_full_ipa.py'
  workflow_dispatch:
concurrency:
  group: bastion-main-proof-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  source-home-metal:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prove all game sources and resources match approved BASTION
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_BASE=2d9dc98765824bfbe15a5f6dfb999c8f98d5d991
          git fetch --no-tags --depth=1 origin "$VERIFIED_BASE"
          git diff --exit-code "$VERIFIED_BASE" HEAD -- . ':(exclude).github/workflows/**' ':(exclude)Reports/**' ':(exclude)ASTEROIDYiOS/Assets/BASTION_PC609.bastion' ':(exclude)Tools/verify_bastion_full_ipa.py'
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          p=Path("ASTEROIDYiOS/Assets/BASTION_PC609.bastion")
          assert p.is_file() and p.stat().st_size==2472062
          assert sha256(p.read_bytes()).hexdigest()=="d18d651aab74bebdb2215940c0774c8aa3f0aff9101c0b7122c336110b3f5e7c"
          print("PASS: original Bastion 6061 pack embedded in source, SHA256 exact")
          PY
          echo "PASS: gameplay sources match approved BASTION; changes only CI, bundle asset and verifier"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify exact PC v602 H290 resources on GitHub
        shell: bash
        run: |
          set -euo pipefail
          # Same verified staging used by the complete PC609 Release IPA.
          # Without these, the earlier 44.9MB BASTION Debug IPA omitted
          # the CARBONIS mesh/textures, PlayerShip367, W3 background/logo.
          python3 Tools/verify_ios_inputs.py
          python3 Tools/prepare_vanguard431_assets.py
          python3 Tools/verify_original_vanguard_resources.py --assets ASTEROIDYiOS/Assets
          python3 Tools/prepare_v568_player_ship_ios.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/prepare_v568_w3_original_assets.py --root . --destination ASTEROIDYiOS/Assets --required
          python3 Tools/prepare_v568_carbonis_sector01.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/stage_pc602_planetarium.py
          python3 Tests/HudPlanetariumIntegration600Contract.py
          python3 Tools/stage_pc602_newhome290.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tools/stage_pc602_orbit_belt51.py --root . --destination ASTEROIDYiOS/Assets
          python3 Tests/PC602OrbitBelt51Tests.py --root . --asset ASTEROIDYiOS/Assets/PC602OrbitBelt51.bin
          python3 Tests/V568W3HomeSourceLightTests.py
          python3 Tests/V568W3PlanetTransparentSourceContract.py
          python3 Tests/SourceLavaLight287SourceContract.py
          python3 Tests/PC602HomeScene291Contract.py
          python3 Tests/PC602HomeWorldUI291Contract.py
          python3 Tests/PC602H290MenuSkyRegression291.py
          python3 Tests/PC602H290LiveSettingsPause291Contract.py
          swiftc -O ASTEROIDYiOS/SourceShipScale472.swift Tests/SourceShipScale472Tests.swift -o /tmp/pc602-shipscale-live-tests
          /tmp/pc602-shipscale-live-tests
          swiftc -O ASTEROIDYiOS/CarbonisVisualSettings568.swift Tests/CarbonisVisualSettings568Tests.swift -o /tmp/pc602-projectile-light-tests
          /tmp/pc602-projectile-light-tests
          python3 Tests/PC602OrbitSave61Contract.py
          python3 Tests/PC602ReplayHUDRegression291.py
          python3 Tests/PC602UnifiedHUDMenu291Contract.py
          swiftc -O ASTEROIDYiOS/PC602OrbitHUDLayout291.swift Tests/PC602OrbitHUDLayout291Tests.swift -o /tmp/pc602-orbit-hud-tests
          /tmp/pc602-orbit-hud-tests
          python3 Tests/PC602O01SourceBaseline.py --ios-root .
          python3 Tools/code_quality_audit.py --root . --gate
      - name: Build original full Swift and Metal for iPhone/iPad (BASTION Release)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          xcodebuild -version
          # Preserve existing Debug CI for unrelated PRs; BASTION IPA
          # must have the same standalone Release binary as PC609.
          CONFIGURATION=Release
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration "$CONFIGURATION" \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO 'TARGETED_DEVICE_FAMILY=1,2' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$PWD/build/PC602Home291" \
            build > diagnostics/xcodebuild.log 2>&1 || {
              grep -n -A 9 -B 4 -E 'error:|FAILED|failed' diagnostics/xcodebuild.log | tail -n 130
              tail -n 45 diagnostics/xcodebuild.log
              exit 1
            }
          python3 - "$CONFIGURATION" <<'PY'
          from pathlib import Path
          import plistlib,sys
          build=Path(f"build/PC602Home291/Build/Products/{sys.argv[1]}-iphoneos")
          apps=list(build.glob("*.app"))
          assert len(apps)==1, apps
          app=apps[0]
          info=plistlib.loads((app/"Info.plist").read_bytes())
          assert set(info["UIDeviceFamily"])=={1,2}
          assert (app/"default.metallib").is_file()
          import hashlib
          original=app/"planetarium.glb"
          assert original.is_file(), "Original PC602 HUD planetarium missing from iOS app"
          assert original.stat().st_size==3228900
          assert hashlib.sha256(original.read_bytes()).hexdigest()=="71ca9ff24e044a831a5c7197e343594dd1fd801284af6231870570b35ad43860"
          assert (app/"W3HomePlanet290OriginalGPU.bin").is_file()
          assert (app/"PC602Home290HeightMap.bin").is_file()
          assert (app/"PC602OrbitBelt51.bin").is_file()
          assert (app/"Vanguard431Source.mesh").is_file()
          assert (app/"Vanguard431Base.jpg").is_file()
          assert (app/"W3HomePlanet290Base.dat").is_file()
          assert (app/"W3HomePlanet293Glow.dat").is_file()
          bastion=app/"BASTION_PC609.bastion"
          assert bastion.is_file(), "BASTION missing from iOS app bundle"
          assert bastion.stat().st_size==2472062, "BASTION bundle truncated"
          assert hashlib.sha256(bastion.read_bytes()).hexdigest()=="d18d651aab74bebdb2215940c0774c8aa3f0aff9101c0b7122c336110b3f5e7c"
          print("PASS: authentic Bastion permanently embedded in native .app; no Files import")
          print("PASS: real iPhone/iPad ARM64 Swift and Metal, source H290 bundle")
          print("NOT TESTED: native GPU draw, 820-asteroid belt, docking, complete active world")
          PY
      - name: Package original-source BASTION iPhone+iPad unsigned test IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/PC602Home291/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP" && test -f "$APP/Info.plist"
          mkdir -p distribution/Payload diagnostics
          cp -R "$APP" distribution/Payload/
          python3 Tools/materialize_pc586_original_resources.py --app "distribution/Payload/$(basename "$APP")" --report diagnostics/bastion-pc586-resources.json
          (cd distribution && zip -q -r -y ../ASTEROIDY_iOS_BASTION_PC609_TEST_UNSIGNED.ipa Payload)
          unzip -t ASTEROIDY_iOS_BASTION_PC609_TEST_UNSIGNED.ipa | tail -1
          python3 Tools/verify_ipa.py ASTEROIDY_iOS_BASTION_PC609_TEST_UNSIGNED.ipa --require-vanguard-original | tee diagnostics/bastion-ipa-verification.txt
          python3 Tools/verify_bastion_full_ipa.py ASTEROIDY_iOS_BASTION_PC609_TEST_UNSIGNED.ipa | tee diagnostics/bastion-full-v609-release-audit.txt
          python3 Tools/verify_pc586_complete_ipa.py ASTEROIDY_iOS_BASTION_PC609_TEST_UNSIGNED.ipa | tee diagnostics/bastion-h55-verification.txt
          python3 Tools/verify_pc602_planetarium_ipa.py ASTEROIDY_iOS_BASTION_PC609_TEST_UNSIGNED.ipa | tee diagnostics/bastion-hud-verification.txt
          shasum -a 256 ASTEROIDY_iOS_BASTION_PC609_TEST_UNSIGNED.ipa | tee diagnostics/bastion-ipa-sha256.txt
          echo "$GITHUB_SHA" > diagnostics/bastion-source-commit.txt
          echo 'BASTION_PC609.bastion is embedded in IPA and loaded automatically by Bundle.main; manual import not required.' > diagnostics/bastion-import-readme.txt
      - name: Publish BASTION unsigned iPhone/iPad test IPA
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-MAIN-BASTION-PC609-RELEASE-IPA-PROOF
          path: |
            ASTEROIDY_iOS_BASTION_PC609_TEST_UNSIGNED.ipa
            diagnostics/bastion-ipa-verification.txt
            diagnostics/bastion-full-v609-release-audit.txt
            diagnostics/bastion-h55-verification.txt
            diagnostics/bastion-hud-verification.txt
            diagnostics/bastion-ipa-sha256.txt
            diagnostics/bastion-source-commit.txt
            diagnostics/bastion-import-readme.txt
          retention-days: 14
          if-no-files-found: error
      - name: Preserve native compile and packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PC602-NewHome291-Metal-ARM64-build-log
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
