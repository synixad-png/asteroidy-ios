# IPA builds. Each job copies the steps of the workflow named in its '# from' comment.
# On push to main, only build-ios runs, in the same cases as
# before (path lists in .github/ci-jobs.json). A manual run builds only `target`.
name: ASTEROIDY iOS - IPA builds
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which IPA build to run
        type: choice
        default: build-ios
        options:
          - build-ios
          - build-ios-boreas-test-05
          - build-ios-iphone-ipad-manual
          - build-ios-pc602-h290-user-test-ipa-20261112
          - build-main-bastion-release-proof
      compatibility_old_ship:
        description: "Tylko stary Vanguard AS3D \u2014 \u015bwiadomie pomi\u0144 oryginaln\u0105 tekstur\u0119"
        type: boolean
        default: false
jobs:
  # Picks which jobs below run: .github/ci-jobs.json + Tools/ci_select_jobs.py
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ inputs.target }}
        run: python3 Tools/ci_select_jobs.py --workflow build-ipa.yml
  # from .github/workflows/build-ios.yml
  # User explicitly requested W3 NEW GAME iPhone/iPad IPA with source difficulty, active profile backup and actual CARBONIS 01.
  # v568 IPA requested 07.11.2026: source Explosion524 optimized V8.2 GPU raymarch + C279 CarbonisCombined469 and NewHome293 lava emission Menu139 #45, original audio runtime synth iPhone/iPad unsigned.
  # Do not include fireflies or remove original audio. The user requested this exact next IPA.
  verify-new-game-source:
    needs: select
    if: ${{ contains(needs.select.outputs.jobs, ' verify-new-game-source ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify original Windows v568 NEW GAME and profile protection
        run: |
          set -euo pipefail
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/CampaignProgress556.swift ASTEROIDYiOS/Sector01Shop568.swift ASTEROIDYiOS/H55Workshop580.swift ASTEROIDYiOS/H55SourceMechanics580.swift ASTEROIDYiOS/CombatTarcza145.swift ASTEROIDYiOS/SourceNewGame568.swift Tests/SourceNewGame568Tests.swift -o /tmp/source-newgame568
          /tmp/source-newgame568
          python3 Tests/SourceNewGame568Contract.py
  # from .github/workflows/build-ios.yml
  expose-build-run:
    needs: select
    if: ${{ contains(needs.select.outputs.jobs, ' expose-build-run ') && (github.event.repository.private == false && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Expose user-requested IPA run identifier
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const path='Reports/LAST_REQUESTED_IPA_RUN.md';
            const text=[
              '# User requested iOS IPA build',
              '',
              'Run ID: '+context.runId,
              'Commit: '+context.sha,
              'Actions: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
              'Status: requested; consult latest GitHub Actions jobs/artifacts',
              'Signing: unsigned IPA, device signing required'
            ].join('\n')+'\n';
            let sha;
            try {
              const current=await github.rest.repos.getContent({owner,repo,path});
              sha=current.data.sha;
            } catch(error) {
              if(error.status!==404) core.warning(String(error));
            }
            try {
              await github.rest.repos.createOrUpdateFileContents({
                owner,repo,path,branch:'main',
                sha,
                message:'Expose requested iPhone IPA workflow run id',
                content:Buffer.from(text).toString('base64')
              });
              core.info('Latest IPA run recorded in '+path);
            } catch(error) {
              core.warning('Could not record run id: '+String(error));
            }
