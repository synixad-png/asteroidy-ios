      - name: Decode BOTH ORIGINAL embedded PC609 ship packs with actual Swift 5 runtime
        shell: bash
        run: |
          set -euo pipefail
          swiftc -Onone ASTEROIDYiOS/SourcePC609Zlib.swift ASTEROIDYiOS/SourceVanguardMesh431.swift ASTEROIDYiOS/SourceKestrel603.swift ASTEROIDYiOS/SourceBastion606.swift Tests/OriginalPC609PackDecoderTests.swift -o /tmp/pc609-actual-packs
          /tmp/pc609-actual-packs | tee reports/original-packs-real-decoding.txt
      - name: Verify KESTREL 6031 format and iOS source integration
        shell: bash
