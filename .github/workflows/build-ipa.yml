            reports/size.txt
          if-no-files-found: error
          retention-days: 14
      - name: Preserve proof of failures, without claiming an IPA was built
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-PC602-H290-IPA-BUILD-DIAGNOSTICS
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
