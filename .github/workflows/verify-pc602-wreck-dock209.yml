name: PC602 original wreck source / H55 docking routing tests

on:
  push:
    branches: [feature/ios-pc602-newhome-world-source]
    paths:
      - .github/workflows/verify-pc602-wreck-dock209.yml
      - ASTEROIDYiOS/PC602WreckDebris209.swift
      - ASTEROIDYiOS/ResearchWreckGeometry214.swift
      - ASTEROIDYiOS/SourceHomeWreck209.swift
      - Tests/PC602OrbitWreck211Tests.swift
      - ASTEROIDYiOS/PC602HomeShipPose291.swift
      - ASTEROIDYiOS/SourceHomeVanguard431.swift
      - Tests/PC602HomeShipPose291Tests.swift
      - ASTEROIDYiOS/PC602HomeFlightInput291.swift
      - ASTEROIDYiOS/SourceControls586.swift
      - Tests/PC602HomeFlightInput291Tests.swift
      - ASTEROIDYiOS/PC602HomeWorldSession291.swift
      - ASTEROIDYiOS/PC602HomeWeaponTest292.swift
      - ASTEROIDYiOS/PC602HomeShotGeometry292.swift
      - Tests/PC602HomeWeapons292Tests.swift
      - ASTEROIDYiOS/SourcePlanetAtmosphere568.swift
      - Tests/PC602O04GraphicsSettings291Tests.swift
      - ASTEROIDYiOS/PC602OrbitHud330.swift
      - Tests/PC602OrbitHud330Tests.swift
      - Tests/PC602HomeWorldSession291Tests.swift
      - ASTEROIDYiOS/PC602HomeHubRoute90.swift
      - ASTEROIDYiOS/PC602HomeFlight291.swift
      - ASTEROIDYiOS/PC602NewHome290.swift
      - Tests/PC602WreckDock209Tests.swift
  pull_request:
    paths:
      - .github/workflows/verify-pc602-wreck-dock209.yml
      - ASTEROIDYiOS/PC602WreckDebris209.swift
      - ASTEROIDYiOS/ResearchWreckGeometry214.swift
      - ASTEROIDYiOS/SourceHomeWreck209.swift
      - Tests/PC602OrbitWreck211Tests.swift
      - ASTEROIDYiOS/PC602HomeShipPose291.swift
      - ASTEROIDYiOS/SourceHomeVanguard431.swift
      - Tests/PC602HomeShipPose291Tests.swift
      - ASTEROIDYiOS/PC602HomeFlightInput291.swift
      - ASTEROIDYiOS/SourceControls586.swift
      - Tests/PC602HomeFlightInput291Tests.swift
      - ASTEROIDYiOS/PC602HomeWorldSession291.swift
      - ASTEROIDYiOS/PC602HomeWeaponTest292.swift
      - ASTEROIDYiOS/PC602HomeShotGeometry292.swift
      - Tests/PC602HomeWeapons292Tests.swift
      - ASTEROIDYiOS/SourcePlanetAtmosphere568.swift
      - Tests/PC602O04GraphicsSettings291Tests.swift
      - ASTEROIDYiOS/PC602OrbitHud330.swift
      - Tests/PC602OrbitHud330Tests.swift
      - Tests/PC602HomeWorldSession291Tests.swift
      - ASTEROIDYiOS/PC602HomeHubRoute90.swift
      - Tests/PC602WreckDock209Tests.swift
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  original-wreck-and-dock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Stage SHA-verified ORIGINAL PC602 H290 terrain
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/stage_pc602_newhome290.py --root . --destination ASTEROIDYiOS/Assets
      - name: Extract original Vec2 from active iOS game (no fake test Vec2)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path("ASTEROIDYiOS/GameCore.swift").read_text()
          start=source.index("struct Vec2: Equatable {")
          brace=source.index("{",start)
          level=0
          for i in range(brace,len(source)):
              if source[i]=="{":level+=1
              elif source[i]=="}":
                  level-=1
                  if level==0:
                      end=i+1
                      break
          else:
              raise RuntimeError("Original source Vec2 braces not closed")
          Path("/tmp/PC602ActualGameVec2.swift").write_text(
              "import Foundation\n"+source[start:end]+"\n")
          PY
      - name: Compile and execute original PC602 debris + Hub90 against live Swift physics
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/PC602WreckDock209Tests.swift /tmp/main.swift
          swiftc -Onone \
            /tmp/PC602ActualGameVec2.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/PC602NewHome290.swift \
            ASTEROIDYiOS/PC602HomeFlight291.swift \
            ASTEROIDYiOS/PC602HomeHubRoute90.swift \
            ASTEROIDYiOS/PC602WreckDebris209.swift \
            /tmp/main.swift -o /tmp/pc602-wreck-dock-source-test
          /tmp/pc602-wreck-dock-source-test \
            ASTEROIDYiOS/Assets/PC602Home290HeightMap.bin
      - name: Test actual PC602 source Vanguard431 flight/orbit pose
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/PC602HomeShipPose291Tests.swift /tmp/main.swift
          swiftc -Onone \
            /tmp/PC602ActualGameVec2.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/PC602NewHome290.swift \
            ASTEROIDYiOS/PC602HomeFlight291.swift \
            ASTEROIDYiOS/PC602HomeShipPose291.swift \
            /tmp/main.swift -o /tmp/pc602-original-vanguard-pose
          /tmp/pc602-original-vanguard-pose \
            ASTEROIDYiOS/Assets/PC602Home290HeightMap.bin
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          mesh=Path("ASTEROIDYiOS/Assets/Vanguard431Source.mesh")
          skin=Path("ASTEROIDYiOS/Assets/Vanguard431Base.jpg")
          expected={
            mesh:"f5d6d0107437fa54c3e8505f9adfbf6143cc877cb970eef687603609e26f9f4a",
            skin:"2945f711a6b559bfb5fdfb79750a2f2f77e2071aa5f3f4173eb450bce81b8b95",
          }
          for path,digest in expected.items():
              assert path.is_file(),str(path)
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,str(path)
          print("PASS original PC602 Vanguard431 entire mesh and skin SHA256")
          PY
      - name: Compile original PC586 saved key-pad to HomeFlight291 input mapping
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/PC602HomeFlightInput291Tests.swift /tmp/main.swift
          swiftc -Onone \
            /tmp/PC602ActualGameVec2.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/PC602NewHome290.swift \
            ASTEROIDYiOS/PC602HomeFlight291.swift \
            ASTEROIDYiOS/SourceControls586.swift \
            ASTEROIDYiOS/PC602HomeFlightInput291.swift \
            /tmp/main.swift -o /tmp/pc602-orbit-saved-controls
          /tmp/pc602-orbit-saved-controls
      - name: Compile source world state coordination (flight-controls-missions-H55)
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/PC602HomeWorldSession291Tests.swift /tmp/main.swift
          swiftc -Onone \
            /tmp/PC602ActualGameVec2.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/PC602NewHome290.swift \
            ASTEROIDYiOS/PC602HomeFlight291.swift \
            ASTEROIDYiOS/PC602HomeHubRoute90.swift \
            ASTEROIDYiOS/SourceControls586.swift \
            ASTEROIDYiOS/PC602HomeFlightInput291.swift \
            ASTEROIDYiOS/PC602HomeWeaponTest292.swift \
            ASTEROIDYiOS/PC602HomeWorldSession291.swift \
            /tmp/main.swift -o /tmp/pc602-original-home-session
          /tmp/pc602-original-home-session \
            ASTEROIDYiOS/Assets/PC602Home290HeightMap.bin
      - name: Compile and exercise real PC602 nonhostile five-gun shot patterns
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/PC602HomeWeapons292Tests.swift /tmp/main.swift
          swiftc -Onone \
            /tmp/PC602ActualGameVec2.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/PC602NewHome290.swift \
            ASTEROIDYiOS/PC602HomeFlight291.swift \
            ASTEROIDYiOS/PC602HomeWorldView291.swift \
            ASTEROIDYiOS/PC602HomeShipPose291.swift \
            ASTEROIDYiOS/PC602HomeWeaponTest292.swift \
            ASTEROIDYiOS/PC602HomeShotGeometry292.swift \
            /tmp/main.swift -o /tmp/pc602-guns-geodesic-test
          /tmp/pc602-guns-geodesic-test \
            ASTEROIDYiOS/Assets/PC602Home290HeightMap.bin
      - name: O04 source PC602 sky settings defaults, migration and hot reload revision
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/PC602O04GraphicsSettings291Tests.swift /tmp/main.swift
          swiftc -Onone ASTEROIDYiOS/SourcePlanetAtmosphere568.swift             /tmp/main.swift -o /tmp/pc602-o04-graphics-settings
          /tmp/pc602-o04-graphics-settings
      - name: Compile and verify original source OrbitHud330 26-tile course zone
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/PC602OrbitHud330Tests.swift /tmp/main.swift
          swiftc -Onone \
            /tmp/PC602ActualGameVec2.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/PC602NewHome290.swift \
            ASTEROIDYiOS/PC602HomeFlight291.swift \
            ASTEROIDYiOS/PC602OrbitHud330.swift \
            /tmp/main.swift -o /tmp/pc602-original-orbit-hud330
          /tmp/pc602-original-orbit-hud330 \
            ASTEROIDYiOS/Assets/PC602Home290HeightMap.bin
      - name: Run actual original complete 3D wreck source golden Swift tests
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/PC602OrbitWreck211Tests.swift /tmp/main.swift
          swiftc -Onone ASTEROIDYiOS/ResearchWreckGeometry214.swift \
            /tmp/main.swift -o /tmp/pc602-full-original-wreck-test
          /tmp/pc602-full-original-wreck-test
      - name: Assert routing does not change active W3 and H55 scene
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          router=Path("ASTEROIDYiOS/PC602HomeHubRoute90.swift").read_text()
          debris=Path("ASTEROIDYiOS/PC602WreckDebris209.swift").read_text()
          assert "flight.canDock90(context:context)" not in router or "PC602HomeFlight291.canDock90" in router
          assert "location == .orbit" in router
          assert "location == .menu" in router
          assert "PC602NewHome290.wreckDebrisCount295" in debris
          assert "PC602NewHome290.wreckTrailLength295" in debris
          assert "spaceHash207" in debris and "spaceRand207" in debris
          assert "scale=PC602NewHome290.wreckScale295" in debris
          app=Path("ASTEROIDYiOS/App.swift").read_text()
          assert "PC602WreckDebris209" not in app
          assert "PC602HomeHubRoute90" not in app
          print("PASS: authenticated PC602 source dock and 146 debris; live W3/H55 unchanged")
          PY
          python3 Tools/code_quality_audit.py --root . --gate
