name: H11 PC580 autonomous Guardian298 plasma parity
on:
  push:
    branches: [feature/ios-h55-v580-native-entry]
    paths:
      - 'ASTEROIDYiOS/CombatGuardianDrone298.swift'
      - 'ASTEROIDYiOS/CarbonisCombat568.swift'
      - 'ASTEROIDYiOS/H55SourceMechanics580.swift'
      - 'Tests/CombatGuardianDrone298Tests.swift'
      - '.github/workflows/h11-guardian-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardian-source:
    name: Exact PC580 targeting and live C279 projectile regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Native Swift H11 original Guardian autonomous drone tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -O \
            ASTEROIDYiOS/GameCore.swift \
            ASTEROIDYiOS/FlightDynamics556.swift \
            ASTEROIDYiOS/CombatCollision556.swift \
            ASTEROIDYiOS/CombatBalance556.swift \
            ASTEROIDYiOS/Sphere67.swift \
            ASTEROIDYiOS/SphereAsteroid556.swift \
            ASTEROIDYiOS/MissionWave568.swift \
            ASTEROIDYiOS/MissionIncoming568.swift \
            ASTEROIDYiOS/MissionStart261.swift \
            ASTEROIDYiOS/CampaignProgress556.swift \
            ASTEROIDYiOS/MissionCatalog568.swift \
            ASTEROIDYiOS/Sector01Entry568.swift \
            ASTEROIDYiOS/Sector01PreparedWave568.swift \
            ASTEROIDYiOS/CarbonisBodyContact68.swift \
            ASTEROIDYiOS/SphereRockContact68.swift \
            ASTEROIDYiOS/ShooterTactics71.swift \
            ASTEROIDYiOS/Sector01Shop568.swift \
            ASTEROIDYiOS/Sector01MissionSummary568.swift \
            ASTEROIDYiOS/Sector01MissionSettlement568.swift \
            ASTEROIDYiOS/CarbonisDestruction524.swift \
            ASTEROIDYiOS/H55Workshop580.swift \
            ASTEROIDYiOS/H55SourceMechanics580.swift \
            ASTEROIDYiOS/CombatGuardianDrone298.swift \
            ASTEROIDYiOS/CarbonisCombat568.swift \
            Tests/CombatGuardianDrone298Tests.swift \
            -o /tmp/h11-guardian-source
          /tmp/h11-guardian-source
      - name: Verify native source ownership and no visual-only projectile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          game=Path('ASTEROIDYiOS/CarbonisCombat568.swift').read_text()
          drone=Path('ASTEROIDYiOS/CombatGuardianDrone298.swift').read_text()
          assert 'guardianDrone.step(' in game
          assert 'guardian298:true' in game
          assert 'guardianDrone.guidedVelocity(' in game
          assert 'stepShots(dt:dt)' in game
          assert 'Sphere67.delta' in drone and 'Sphere67.offset' in drone
          assert 'H55SourceMechanics580.guardianShotCooldown' in drone
          assert 'H55SourceMechanics580.guardianShotDamage' in drone
          assert 'var guardian298:Bool = false' in game
          print('PASS Guardian298 real autonomous plasma, shared swept collision, no duplicate wallet')
          PY
