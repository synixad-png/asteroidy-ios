    needs: [verify-sphere-linux, verify-new-game-source]
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish run number for live project status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          repo=os.environ.get("GITHUB_REPOSITORY","")
          run=os.environ.get("GITHUB_RUN_ID","")
          sha=os.environ.get("GITHUB_SHA","")
          path="Reports/LAST_REQUESTED_IPA_RUN.md"
          data=f"# User-requested iPhone/iPad build\\n\\nRun ID: {run}\\nCommit: {sha}\\nStatus: GitHub Actions running; check job conclusion before claiming IPA.\\n"
          url=f"https://api.github.com/repos/{repo}/contents/{path}"
          token=os.environ["GH_TOKEN"]
          headers={"Authorization":f"Bearer {token}",
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          try:
              response=urllib.request.urlopen(urllib.request.Request(url,headers=headers))
              old=json.load(response).get("sha")
          except urllib.error.HTTPError:
              old=None
          payload={"message":"Record requested iPhone iPad IPA build run",
                   "content":base64.b64encode(data.encode()).decode(),"branch":"main"}
          if old:payload["sha"]=old
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),
              headers={**headers,"Content-Type":"application/json"},method="PUT")
          try:
              print(urllib.request.urlopen(req).status)
          except Exception as error:
              print("Status reporting unavailable:",error)
          PY
