      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native Xcode project
        run: xcodegen generate
      - name: Compile iPhone/iPad device build (unsigned)
        run: |
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build build
      - name: Package unsigned IPA for Sideloadly signing
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          test -d "$APP"
          test -f "$APP/Info.plist"
          echo "Packaging $APP"
          mkdir -p distribution/Payload
          cp -R "$APP" distribution/Payload/
          (cd distribution && zip -q -r -y ../ASTEROIDY_iOS_UNSIGNED.ipa Payload)
          unzip -t ASTEROIDY_iOS_UNSIGNED.ipa | tail -1
          python3 Tools/verify_ipa.py ASTEROIDY_iOS_UNSIGNED.ipa | tee reports/ipa-verification.txt
          shasum -a 256 ASTEROIDY_iOS_UNSIGNED.ipa > reports/SHA256SUMS.txt
      - name: Upload unsigned device IPA (not signed)
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-iOS-device-unsigned-ipa
          path: |
            ASTEROIDY_iOS_UNSIGNED.ipa
            reports/
          if-no-files-found: error
          retention-days: 3
