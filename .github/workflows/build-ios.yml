name: ASTEROIDY iOS - unsigned iPhone and iPad IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios.yml'

jobs:
  verify-sphere-linux:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift Linux availability
        run: swift --version
      - name: Verify original Physics68 impulse, spin, rock fragment and geodesic mission gates
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/SphereSector556.swift Tests/SpherePhysicsAndMissionGate556Tests.swift -o /tmp/physics68-test
          /tmp/physics68-test
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/SphereSector556.swift Tests/Action38SphereQuota556Tests.swift -o /tmp/action38-test
          /tmp/action38-test
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift Tests/SphereRockContact68Tests.swift -o /tmp/contact68-test
          /tmp/contact68-test
      - name: Verify complete spherical combat regressions without macOS
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/SphereSector556.swift Tests/SphereSector556Tests.swift -o /tmp/sphere-sector-full
          /tmp/sphere-sector-full
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/SphereSector556.swift Tests/SphereCombatBatch556Tests.swift -o /tmp/sphere-combat-full
          /tmp/sphere-combat-full
  compile-device:
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Record build environment
        run: |
          mkdir -p reports
          { sw_vers; xcodebuild -version; swift --version; echo "Commit $GITHUB_SHA"; } | tee reports/environment.txt
      - name: Verify gameplay core (all required dependencies)
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift Tests/GameCoreTests.swift -o /tmp/ios-gamecore-tests
          /tmp/ios-gamecore-tests
      - name: Verify v556 campaign progress rules
        run: |
          swiftc ASTEROIDYiOS/CampaignProgress556.swift Tests/CampaignProgress556Tests.swift -o /tmp/ios-campaign-tests
          /tmp/ios-campaign-tests
      - name: Verify combat balancing from ASTEROIDY v556
        run: |
          swiftc ASTEROIDYiOS/CombatBalance556.swift Tests/CombatBalance556Tests.swift -o /tmp/ios-combat-balance-tests
          /tmp/ios-combat-balance-tests
      - name: Verify integrated sector sandbox and legacy arena
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift Tests/SectorSandbox556Tests.swift -o /tmp/sector-tests
          /tmp/sector-tests
      - name: Verify v556 rock armor, splitting, terminal shards and sector waves
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift Tests/RockCombat556Tests.swift -o /tmp/rock-combat-tests
          /tmp/rock-combat-tests
      - name: Verify Gameplay65 objective types and mission timers
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift Tests/ObjectiveTiming556Tests.swift -o /tmp/objective-tests
          /tmp/objective-tests
      - name: Verify Action38 reinforcement coordinates and timing
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift Tests/IncomingRocks556Tests.swift -o /tmp/incoming-tests
          /tmp/incoming-tests
      - name: Verify Gameplay65 flat escort path and Action38 count gate
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift Tests/FlatEscort556Tests.swift -o /tmp/flat-escort-tests
          /tmp/flat-escort-tests
      - name: Verify v556 initial asteroid positions and velocities
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift Tests/SectorSpawn556Tests.swift -o /tmp/sector-spawns
          /tmp/sector-spawns
      - name: Verify spherical asteroid geodesic physics from v556
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift Tests/SphereAsteroids556Tests.swift -o /tmp/sphere-asteroid-tests
          /tmp/sphere-asteroid-tests
      - name: Verify Boreas hull damage and deterministic no-contact cooldown
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/SphereSector556.swift Tests/SphereSector556Tests.swift -o /tmp/sphere-sector-tests
          /tmp/sphere-sector-tests
      - name: Verify spherical combat, 5760-frame gate and surviving rock guard
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/SphereSector556.swift Tests/SphereCombatBatch556Tests.swift -o /tmp/sphere-batch-tests
          /tmp/sphere-batch-tests
      - name: Verify true Physics68 splits and guarded enemy/boss completion
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/SphereSector556.swift Tests/SpherePhysicsAndMissionGate556Tests.swift -o /tmp/physical68-tests
          /tmp/physical68-tests
      - name: Verify Action38 spherical arrivals and enemy-verified cancellation
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift ASTEROIDYiOS/SphereSector556.swift Tests/Action38SphereQuota556Tests.swift -o /tmp/arrival68-tests
          /tmp/arrival68-tests
      - name: Verify Physics68 rock collision impulse and 216-cell broadphase
        run: |
          swiftc ASTEROIDYiOS/GameCore.swift ASTEROIDYiOS/FlightDynamics556.swift ASTEROIDYiOS/CombatCollision556.swift ASTEROIDYiOS/CombatBalance556.swift ASTEROIDYiOS/Sphere67.swift ASTEROIDYiOS/SphereAsteroid556.swift ASTEROIDYiOS/SphereRockContact68.swift Tests/SphereRockContact68Tests.swift -o /tmp/rock-contact-68
          /tmp/rock-contact-68
      - name: Verify telemetry module
        run: |
          swiftc ASTEROIDYiOS/RenderTelemetry.swift Tests/RenderTelemetryTests.swift -o /tmp/ios-telemetry-tests
          /tmp/ios-telemetry-tests
      - name: Verify original 3D Vanguard resource
        run: |
          swiftc ASTEROIDYiOS/AssetMesh.swift Tests/AssetMeshTests.swift -o /tmp/ios-asset-tests
          /tmp/ios-asset-tests ASTEROIDYiOS/Assets/Vanguard556.as3d
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native Xcode project
        run: xcodegen generate
      - name: Compile iPhone/iPad device build (unsigned)
        run: |
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build build
      - name: Package unsigned IPA for Sideloadly signing
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          test -d "$APP"
          test -f "$APP/Info.plist"
          echo "Packaging $APP"
          mkdir -p distribution/Payload
          cp -R "$APP" distribution/Payload/
          (cd distribution && zip -q -r -y ../ASTEROIDY_iOS_UNSIGNED.ipa Payload)
          unzip -t ASTEROIDY_iOS_UNSIGNED.ipa | tail -1
          python3 Tools/verify_ipa.py ASTEROIDY_iOS_UNSIGNED.ipa | tee reports/ipa-verification.txt
          shasum -a 256 ASTEROIDY_iOS_UNSIGNED.ipa > reports/SHA256SUMS.txt
      - name: Upload unsigned device IPA (not signed)
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-iOS-device-unsigned-ipa
          path: |
            ASTEROIDY_iOS_UNSIGNED.ipa
            reports/
          if-no-files-found: error
          retention-days: 3
