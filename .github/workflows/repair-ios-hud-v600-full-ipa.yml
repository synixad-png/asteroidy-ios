# One-shot FIX of incomplete 2026-11-10 HUD v600 unsigned iOS IPA.
# Preserve the already-compiled, verified Release ARM64 executable and
# restore *every* original verified game asset used by the previous full builds.
name: ASTEROIDY iOS HUD v600 - RESTORE full original assets in IPA
on:
  push:
    branches: [feature/ios-h55-v580-native-entry]
    paths: [.github/workflows/repair-ios-hud-v600-full-ipa.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  restore-complete-ipa:
    name: Restore and audit original Carbonis, W3, PC586 and H55 source assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exact already-built Release ARM64 HUD v600 IPA
        uses: actions/download-artifact@v4
        with:
          name: ASTEROIDY-iOS-HUD-v600-UNSIGNED-IPA
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42840039874
          repository: synixad-png/asteroidy-ios
          path: old-ipa
      - name: Verify old app identity and ORIGINAL GitHub resource inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          test -f old-ipa/ASTEROIDY_iOS_HUD_v600_iPhone_iPad_UNSIGNED.ipa
          echo '12076c097f0864bc8110baf5a4a29031136905dc7a4da73cf8456a93763f314a  old-ipa/ASTEROIDY_iOS_HUD_v600_iPhone_iPad_UNSIGNED.ipa' | sha256sum -c -
          python3 Tools/verify_ipa.py old-ipa/ASTEROIDY_iOS_HUD_v600_iPhone_iPad_UNSIGNED.ipa --require-vanguard-original | tee reports/original-ipa.txt
          python3 Tools/materialize_pc586_original_resources.py --source SourceResources/PC586 --report reports/original-15-models.json
      - name: Recover exact game resources from verified audited archive set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/game
          python3 Tools/stage_v568_resources.py --root . --verify-only | tee reports/v568-four-part-integrity.txt
          python3 Tools/prepare_v568_carbonis_sector01.py --root . --destination staging/game | tee reports/carbonis-source.txt
          python3 Tools/prepare_v568_w3_home_planet290.py --root . --destination staging/game | tee reports/w3-home-source.txt
          python3 Tools/prepare_v568_player_ship_ios.py --root . --destination staging/game | tee reports/ship-source.txt
          python3 Tools/prepare_v568_w3_original_assets.py --root . --destination staging/game --required | tee reports/w3-menu-source.txt
          test "$(find staging/game -maxdepth 1 -type f | wc -l)" -eq 16
      - name: Restore 31 real source files WITHOUT touching compiled executable
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/repair_ios_hud_v600_full_assets.py \
            --base-ipa old-ipa/ASTEROIDY_iOS_HUD_v600_iPhone_iPad_UNSIGNED.ipa \
            --staged-v568 staging/game \
            --source-resources SourceResources/PC586 \
            --output ASTEROIDY_iOS_HUD_v600_PELNE_ZASOBY_UNSIGNED.ipa \
            --report reports/full-assets-proof.json
          python3 Tools/verify_ipa.py ASTEROIDY_iOS_HUD_v600_PELNE_ZASOBY_UNSIGNED.ipa --require-vanguard-original | tee reports/arm64-verified.txt
          python3 Tools/verify_pc586_complete_ipa.py ASTEROIDY_iOS_HUD_v600_PELNE_ZASOBY_UNSIGNED.ipa | tee reports/pc586-complete-verify.json
          python3 - <<'PY'
          import json,pathlib
          j=json.loads(pathlib.Path('reports/full-assets-proof.json').read_text())
          assert j['result']=='PASS' and j['original_members_preserved']>=55
          assert j['new_source_verified_assets']==31
          assert j['unsigned']
          print('PASS: 31 exact source assets, all prior app bytes unchanged')
          PY
          unzip -t ASTEROIDY_iOS_HUD_v600_PELNE_ZASOBY_UNSIGNED.ipa | tail -n 1 | tee reports/archive-crc.txt
          sha256sum ASTEROIDY_iOS_HUD_v600_PELNE_ZASOBY_UNSIGNED.ipa | tee reports/SHA256SUMS.txt
          wc -c ASTEROIDY_iOS_HUD_v600_PELNE_ZASOBY_UNSIGNED.ipa | tee reports/ipa-size.txt
      - name: Publish repaired full-resource IPA and audit proof
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-HUD-v600-FULL-RESTORED-UNSIGNED-IPA
          path: |
            ASTEROIDY_iOS_HUD_v600_PELNE_ZASOBY_UNSIGNED.ipa
            reports/
          retention-days: 14
          if-no-files-found: error
      - name: Publish diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-HUD-v600-FULL-ASSETS-FAILURE
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
