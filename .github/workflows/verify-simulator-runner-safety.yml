name: ASTEROIDY iOS simulator proof safety (NO IPA)
on:
  push:
    branches: [main]
    paths:
      - 'Tools/run_original_ios_simulator_capture.py'
      - 'Tests/SimulatorSmokeHarnessTests.py'
      - '.github/workflows/verify-simulator-runner-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python test and runner
        run: python3 -m py_compile Tools/run_original_ios_simulator_capture.py Tests/SimulatorSmokeHarnessTests.py
      - name: Execute deterministic real-process timeout and stale-proof safeguards
        run: python3 Tests/SimulatorSmokeHarnessTests.py
      - name: Validate no IPA creation
        run: |
          test ! -e ASTEROIDY_iOS_UNSIGNED.ipa
          echo 'PASS: regression tests only; no iOS app or IPA created'
