name: ASTEROIDY iOS H08 PC v580 mechanic route and real-GLB parity
on:
  push:
    branches: [feature/ios-h55-v580-native-entry]
    paths:
      - 'ASTEROIDYiOS/H55NpcSurface580.swift'
      - 'ASTEROIDYiOS/H55Mechanic580.swift'
      - 'ASTEROIDYiOS/H55NpcDetour580.swift'
      - 'ASTEROIDYiOS/H55ScenePage580.swift'
      - 'Tests/H55H08SourceTests.swift'
      - 'Tests/H55H08PatrolRealGLBTests.swift'
      - 'Tests/H55NpcRealRoute580Tests.swift'
      - '.github/workflows/h08-parity-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-h08:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: NPC v525-v544 route geometry and fail-closed source tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -O ASTEROIDYiOS/H55CollisionGeometry580.swift \
            ASTEROIDYiOS/H55SpatialSupport580.swift \
            ASTEROIDYiOS/H55TriangleBody580.swift \
            ASTEROIDYiOS/H55NpcDetour580.swift \
            ASTEROIDYiOS/H55Mechanic580.swift \
            ASTEROIDYiOS/H55NpcSurface580.swift \
            ASTEROIDYiOS/H55Airlocks580.swift \
            Tests/H55H08SourceTests.swift -o /tmp/h08-source
          /tmp/h08-source
          # Verify existing H08 precursor and H07 door-regression unchanged.
          swiftc ASTEROIDYiOS/H55NpcDetour580.swift \
            ASTEROIDYiOS/H55Mechanic580.swift \
            Tests/H55Mechanic580Tests.swift -o /tmp/h08-previous-npc
          /tmp/h08-previous-npc
      - name: Compile entire 126MB original GLB patrol integration harness
        shell: bash
        run: |
          set -euo pipefail
          swiftc -O ASTEROIDYiOS/H55CollisionGeometry580.swift \
            ASTEROIDYiOS/H55SpatialSupport580.swift \
            ASTEROIDYiOS/H55TriangleBody580.swift \
            ASTEROIDYiOS/H55NpcDetour580.swift \
            ASTEROIDYiOS/H55Mechanic580.swift \
            ASTEROIDYiOS/H55NpcSurface580.swift \
            ASTEROIDYiOS/H55Airlocks580.swift \
            Tests/H55H08PatrolRealGLBTests.swift -o /tmp/h08-real-glb
          swiftc -O ASTEROIDYiOS/H55CollisionGeometry580.swift \
            ASTEROIDYiOS/H55SpatialSupport580.swift \
            ASTEROIDYiOS/H55TriangleBody580.swift \
            ASTEROIDYiOS/H55NpcDetour580.swift \
            ASTEROIDYiOS/H55Mechanic580.swift \
            ASTEROIDYiOS/H55NpcSurface580.swift \
            ASTEROIDYiOS/H55Airlocks580.swift \
            Tests/H55NpcRealRoute580Tests.swift -o /tmp/h08-real-glb-two-leg-e2e
          swiftc -frontend -parse ASTEROIDYiOS/H55ScenePage580.swift
          python3 - <<'PY'
          from pathlib import Path
          scene=Path('ASTEROIDYiOS/H55ScenePage580.swift').read_text()
          route=Path('ASTEROIDYiOS/H55NpcSurface580.swift').read_text()
          assert 'let npcSurface=try H55NpcSurface580.prepare(collision:physical)' in scene
          assert scene.index('H55NpcSurface580.prepare(collision:physical)') < scene.index('GLTFAsset.load(with:url')
          assert 'groundAt:{x,z in npcSurface.ground(x:x,z:z)}' in scene
          assert 'root.position=SCNVector3(mechanic.x,mechanic.y,mechanic.z)' in scene
          assert 'mechanic.configureSpawn(' in scene
          assert 'abs(importedNpc.position.x-H55NpcSurface580.rootX)<0.001' in scene
          assert 'routeX' not in scene, 'The route belongs only to H55Mechanic580'
          assert 'collision.bodyClear379' in route
          assert 'for j in 0...n' in route and '0.08' in route
          assert 'H55NpcDetour580.bypass' in Path('ASTEROIDYiOS/H55Mechanic580.swift').read_text()
          print("PASS H08: exact GLB root, complete 28-point preflight, original ground seam, dynamic NPC height and A*/H07 unchanged")
          PY
          echo 'REAL-GLB TEST REQUIRES 126419336-byte SHA-authenticated hangar_h55.glb (not in repository)'
      - uses: actions/upload-artifact@v4
        with:
          name: H08-ORIGINAL-GLB-ROUTE-PARITY-SOURCES
          retention-days: 14
          if-no-files-found: error
          path: |
            ASTEROIDYiOS/H55CollisionGeometry580.swift
            ASTEROIDYiOS/H55SpatialSupport580.swift
            ASTEROIDYiOS/H55TriangleBody580.swift
            ASTEROIDYiOS/H55NpcSurface580.swift
            ASTEROIDYiOS/H55NpcDetour580.swift
            ASTEROIDYiOS/H55Mechanic580.swift
            ASTEROIDYiOS/H55Airlocks580.swift
            Tests/H55H08SourceTests.swift
            Tests/H55H08PatrolRealGLBTests.swift
            Tests/H55NpcRealRoute580Tests.swift
