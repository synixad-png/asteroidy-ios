  # from .github/workflows/verify-metal-camera.yml
  # Keep only the latest Metal source-check revision in the runner queue.
  # Does not trigger, archive, sign, or upload any IPA.
  source-camera-linux:
    needs: select
    if: ${{ contains(needs.select.outputs.jobs, ' source-camera-linux ') }}
    concurrency:
      group: asteroidy-ios-metal-source-${{ github.ref }}-source-camera-linux
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Original C# v556 camera orbit and right/up/forward projection
