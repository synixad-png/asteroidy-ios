  # from .github/workflows/audit-boreas-glb-archives.yml
  audit-boreas-glb-archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all original SHA256-verified PC v568 asset archives
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from Tools.stage_v568_resources import verify_archive_set
          archives,entries,manifest,_=verify_archive_set(Path.cwd())
          try:
              k='PortingResources/v568/Shared/assets/planets/boreas_ferrofluid.glb'
              print('BOREAS_ARCHIVE_PRESENT=',k in entries)
              print('GLB_SOURCE_CANDIDATES=',[x for x in entries if 'boreas' in x.lower() or 'ferrofluid' in x.lower()])
              if k in entries:
                  import hashlib
                  blob=entries[k][0].read(entries[k][1])
                  print('BOREAS_GLB_BYTES=',len(blob))
                  print('BOREAS_GLB_SHA256=',hashlib.sha256(blob).hexdigest())
          finally:
              for z in archives: z.close()
          PY
