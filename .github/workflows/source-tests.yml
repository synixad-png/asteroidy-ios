  # from .github/workflows/verify-combat-only.yml
  publish-combat-verify-run:
    needs: select
    if: ${{ contains(needs.select.outputs.jobs, ' publish-combat-verify-run ') && (github.event_name != 'pull_request') }}
    concurrency:
      group: verify-combat-only-${{ github.ref }}-publish-combat-verify-run
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Expose run for source fighter regression review
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const path='Reports/LAST_COMBAT_VERIFY_RUN.md';
            const body='# ASTEROIDY CARBONIS source combat CI\n\nRun ID: '+context.runId+
              '\nCommit: '+context.sha+'\nActions: https://github.com/'+owner+
              '/'+repo+'/actions/runs/'+context.runId+'\n';
            // Other workflows (build-ios.yml) also commit status files to
            // main. If main moves between read and write, GitHub answers
            // 409; re-read the file sha and retry. A 4th failure still fails.
            for (let attempt=1;;attempt++) {
              let sha;
              try {
                sha=(await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha;
              } catch (error) {
                if (error.status!==404) core.warning(String(error));
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,repo,path,sha,branch:'main',
                  message:'Expose source fighter geometry CI run',
                  content:Buffer.from(body).toString('base64')
                });
                break;
              } catch (error) {
                if (error.status!==409 || attempt>=4) throw error;
                core.warning('main moved during status write, retry '+attempt+': '+error.message);
                await new Promise(resolve=>setTimeout(resolve,3000*attempt));
              }
            }
