# Linux (and two macOS) source regression tests.
# Every job copies the steps of the workflow named in its '# from' comment.
# A job runs in the same cases as its old workflow: the select job checks
# .github/ci-jobs.json (events + path lists) with Tools/ci_select_jobs.py.
# Jobs from h05..h13/h55/pc586/pc609/hud-v600/source-tests always run on PRs and main.
# Concurrency is per job: each job keeps the group its old workflow had.
name: ASTEROIDY iOS - source regression tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: Old workflow name to run, or all
        type: choice
        default: all
        options:
          - all
          - audit-boreas-glb-archives
          - build-ios-h55-fps-preview-ipa
          - h05-parity-check
          - h07-parity-check
          - h08-npc-route
          - h08-parity-check
          - h09-parity-check
          - h11-fast-source
          - h11-guardian-source
          - h11-model-independent-source
          - h11-profile-archive
          - h11-rail-swarm-source
          - h12-drone-source
          - h12-machinery-source
          - h12-test-ipa
          - h13-material-metadata
          - h55-fps-original-weapon
          - h55-touch-light-fix
          - hud-v600-validation
          - source-tests
          - verify-bastion606-source-no-ipa
          - verify-combat-only
          - verify-ios-inputs
          - verify-ios-playership367-gpu-once
          - verify-metal-camera
          - verify-pc586-controls
          - verify-pc586-pickup-catalog
          - verify-pc602-belt-source
          - verify-pc602-wreck-dock209
          - verify-pc609-shield-armor-no-ipa
          - verify-simulator-runner-safety
          - verify-v568-assets
          - verify-v568-carbonis-source
permissions:
  contents: read
jobs:
  # Picks which jobs below run: .github/ci-jobs.json + Tools/ci_select_jobs.py
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ inputs.run }}
        run: python3 Tools/ci_select_jobs.py --workflow source-tests.yml
  # from .github/workflows/h05-parity-check.yml
  h05-parity-check:
    needs: select
    if: ${{ contains(needs.select.outputs.jobs, ' h05-parity-check ') }}
    concurrency:
      group: source-tests-${{ github.ref }}-h05-parity-check
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check source H02-H05 implementation
        run: |
          set -euo pipefail
          swiftc ASTEROIDYiOS/H55CollisionGeometry580.swift ASTEROIDYiOS/H55SpatialSupport580.swift ASTEROIDYiOS/H55TriangleBody580.swift ASTEROIDYiOS/H55Entry580.swift Tests/H55Entry580Tests.swift -o /tmp/h05-spawn
          /tmp/h05-spawn
      - name: Export exact H05/H02-H04 source for real GLB differential
        uses: actions/upload-artifact@v4
        with:
          name: H05-GLB-ENTRY-SOURCE-EVIDENCE
          path: |
            ASTEROIDYiOS/H55CollisionGeometry580.swift
            ASTEROIDYiOS/H55SpatialSupport580.swift
            ASTEROIDYiOS/H55TriangleBody580.swift
            ASTEROIDYiOS/H55Entry580.swift
            Tests/H55Entry580Tests.swift
          retention-days: 1
          if-no-files-found: error
  # from .github/workflows/h07-parity-check.yml
  h07-parity-check:
    needs: select
    if: ${{ contains(needs.select.outputs.jobs, ' h07-parity-check ') }}
    concurrency:
      group: source-tests-${{ github.ref }}-h07-parity-check
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: PC v393/v544 controller, actual GLB-format channels, H06 player and NPC collision
        shell: bash
        run: |
          set -euo pipefail
          swiftc -O \
            ASTEROIDYiOS/H55CollisionGeometry580.swift \
            ASTEROIDYiOS/H55SpatialSupport580.swift \
            ASTEROIDYiOS/H55TriangleBody580.swift \
            ASTEROIDYiOS/H55Sweep401580.swift \
            ASTEROIDYiOS/H55Walk580.swift \
            ASTEROIDYiOS/H55NpcDetour580.swift \
            ASTEROIDYiOS/H55Mechanic580.swift \
