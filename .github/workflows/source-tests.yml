# Source regression tests for features already merged into main.
# Jobs marked 'from <file>' are copied unchanged from that deleted workflow (only the job id changed).
# Those workflows only started on feature branches that are merged now, so main never ran them.
# The last three jobs keep tests whose only other workflows were deleted IPA or one-shot runs;
# each command is copied exactly from the workflow named in its comment.
name: ASTEROIDY iOS - source regression tests (merged features)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # from .github/workflows/h05-parity-check.yml
  h05-parity-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check source H02-H05 implementation
        run: |
          set -euo pipefail
          swiftc ASTEROIDYiOS/H55CollisionGeometry580.swift ASTEROIDYiOS/H55SpatialSupport580.swift ASTEROIDYiOS/H55TriangleBody580.swift ASTEROIDYiOS/H55Entry580.swift Tests/H55Entry580Tests.swift -o /tmp/h05-spawn
          /tmp/h05-spawn
      - name: Export exact H05/H02-H04 source for real GLB differential
        uses: actions/upload-artifact@v4
        with:
          name: H05-GLB-ENTRY-SOURCE-EVIDENCE
          path: |
            ASTEROIDYiOS/H55CollisionGeometry580.swift
            ASTEROIDYiOS/H55SpatialSupport580.swift
            ASTEROIDYiOS/H55TriangleBody580.swift
            ASTEROIDYiOS/H55Entry580.swift
            Tests/H55Entry580Tests.swift
          retention-days: 1
          if-no-files-found: error
