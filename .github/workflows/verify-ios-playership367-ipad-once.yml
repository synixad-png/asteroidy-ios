# Real ASTEROIDY v568 original PlayerShip367 iPad simulator GPU evidence.
# One-shot push on creation; explicitly no device IPA, signing or replacement art.
name: ASTEROIDY v568 original PlayerShip367 iPad GPU draw (NO IPA)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ios-playership367-ipad-once.yml'

permissions:
  contents: read

jobs:
  real-v568-ship367-ipad-sim:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify precise original v568 model/texture and GPU proof tests
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 Tools/stage_v568_resources.py --root . --verify-only | tee reports/v568-source-integrity.txt
          python3 Tests/V568PlayerShip367Tests.py | tee reports/source367-mesh.txt
          python3 Tests/V568PlayerShip367GPUProofContract.py | tee reports/gpu-proof-contract.txt
          swift Tools/verify_simulator_render_snapshot.swift --self-test | tee reports/screenshot-detector-self-test.txt
      - name: Prepare source-equivalent GPU data and real JPEG texture
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/prepare_v568_player_ship_ios.py --root . --destination ASTEROIDYiOS/Assets
      - name: Generate original Swift/Metal iOS app project
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Compile original app for iPad simulator without IPA
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ASTEROIDYiOS.xcodeproj \
            -scheme ASTEROIDYiOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$PWD/build/Sim367iPad" \
            build > reports/xcodebuild.log 2>&1 || {
              tail -n 130 reports/xcodebuild.log
              exit 1
            }
          APP=$(find build/Sim367iPad/Build/Products/Debug-iphonesimulator \
                -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          python3 - "$APP" <<'PY' | tee reports/bundled-v568-assets.txt
          import pathlib,hashlib,plistlib,sys
          app=pathlib.Path(sys.argv[1])
          info=plistlib.loads((app/"Info.plist").read_bytes())
          assert set(info.get("UIDeviceFamily",[]))=={1,2}
          assert info["CFBundleIdentifier"]=="com.synixad.asteroidyios"
          for name in ("PlayerShip367OriginalGPU.bin","PlayerShip363Base.jpg"):
              bundled=list(app.rglob(name))
              assert len(bundled)==1,(name,bundled)
              expected=pathlib.Path("ASTEROIDYiOS/Assets")/name
              assert hashlib.sha256(bundled[0].read_bytes()).digest()==hashlib.sha256(expected.read_bytes()).digest()
          assert len(list(app.rglob("default.metallib")))==1
          print("PASS exact v568 source PlayerShip367 and texture bundled for iPad app")
          PY
      - name: Execute actual iPad simulator Metal draw and save authentic screenshot
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/Sim367iPad/Build/Products/Debug-iphonesimulator \
                -maxdepth 1 -type d -name '*.app' -print -quit)
          python3 -u Tools/run_v568_player_ship367_simulator_capture.py \
            --app "$APP" --reports reports --only IPAD | tee reports/source367-ipad-test.txt
      - name: Upload genuine proof and screenshot, not an IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTEROIDY-original-v568-PlayerShip367-real-iPad-GPU-proof-NO-IPA
          path: |
            reports/*.txt
            reports/*.log
            reports/*_GPU_source367_proof.json
            reports/*_VERIFIED_ASTEROIDY_source367.png
            reports/selected-devices.json
          if-no-files-found: ignore
          retention-days: 7
